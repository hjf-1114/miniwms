<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批次库存 - MiniWMS</title>
<link rel="stylesheet" href="/miniwms/css/style.css">
<style>
.chk { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; margin: 0 0 12px; }
.chk span { padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border, #ddd); }
.chk .ok { color: var(--success, #1d7a4d); }
.chk .bad { color: var(--danger, #c0392b); }
.hint { font-size: 13px; line-height: 1.7; color: var(--text-muted, #666); margin: 0 0 12px; }
.m23-pill { display:inline-block; border-radius:10px; padding:1px 8px; font-size:11px; white-space:nowrap; }
.m23-reserved { background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; }
.m23-common { background:#f1f5f9; color:#64748b; border:1px solid #e2e8f0; }
.m23-frozen { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
.m23-qc { background:#fff7ed; color:#b45309; border:1px solid #fed7aa; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>批次库存</h1><div class="crumb">MiniWMS / 仓储作业 / 库存与追溯</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
      <div class="card">
        <div class="card-head">
          <h2>批次级库存余额</h2>
          <div>
            <button class="btn secondary" onclick="reconcile()">账目核对</button>
          </div>
        </div>
        <div id="reconcileBox" class="chk"></div>
        <form class="toolbar inventory-filters" id="batchFilters">
          <label>货主 <select id="batchOwner" name="owner_id"></select></label>
          <label>物料 <input id="batchProduct" name="product_keyword" placeholder="名称 / SKU / 货号 / 条码"></label>
          <label>货位 <select id="batchLocation" name="location_id"></select></label>
          <label>批号 <input id="batchNo" name="batch_no" placeholder="批次号 / 厂家批号 / 内部批次号"></label>
          <select id="hasStock" name="has_stock" aria-label="库存范围">
            <option value="">全部明细</option>
            <option value="1">仅非零库存</option>
          </select>
          <select id="customerFilter" name="designated_customer_id" aria-label="客户归属"><option value="">全部客户归属</option></select>
          <select id="statusFilter" name="stock_status" aria-label="质量状态">
            <option value="">全部质量状态</option>
            <option value="非限制">非限制</option>
            <option value="质检">质检</option>
            <option value="冻结">冻结</option>
          </select>
          <label>批次字段 <select id="batchFieldFilter" name="batch_field"><option value="">选择字段</option></select></label>
          <input name="batch_value" aria-label="批次字段值" placeholder="输入字段值">
          <button class="btn" type="submit">查询</button>
          <button class="btn secondary" type="reset">清空</button>
        </form>
        <div class="inventory-linked-filter text-sm muted" id="linkedProductFilter" hidden></div>
        <div class="table-wrap inventory-grid">
          <table>
            <thead><tr>
              <th class="inventory-anchor">物料</th><th>货主</th><th>规格</th><th>单位</th><th>货位</th>
              <th>批次号</th><th>在手</th><th>已分配</th><th>可用</th>
              <th>质量状态</th><th>指定客户</th><th>原内部批次号</th><th>入库单</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pager">
          <button class="btn secondary" id="prevBtn" onclick="turn(-1)">上一页</button>
          <span id="pageInfo"></span>
          <button class="btn secondary" id="nextBtn" onclick="turn(1)">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/miniwms/js/preview-api.js?v=a3c8e5cf89f0"></script>
<script src="/miniwms/js/api.js"></script>
<script src="/miniwms/js/layout.js"></script>
<script src="/miniwms/js/batch_details.js"></script>
<script src="/miniwms/js/inventory_filters.js"></script>
<script>
let page = 1, pageSize = 30, customerMap = {}, stockFields = [];
const filterForm = document.getElementById("batchFilters");
const initialParams = new URLSearchParams(location.search);
let linkedProduct = initialParams.get("product_id");
const linkedNotice = document.getElementById("linkedProductFilter");
if (linkedProduct) {
  linkedNotice.hidden = false;
  linkedNotice.textContent = "当前按所选库存行的物料查询。输入其他物料或清空可解除关联筛选。";
}
document.getElementById("batchOwner").dataset.initial = initialParams.get("owner_id") || "";
document.getElementById("batchLocation").dataset.initial = initialParams.get("location_id") || "";
document.getElementById("batchProduct").value = initialParams.get("product_keyword") || "";
document.getElementById("hasStock").value = initialParams.get("has_stock") || "";

function customerName(id) {
  const c = customerMap[id];
  return c ? `${c.code} · ${c.name}` : `客户 #${id}`;
}
function reservedPill(id) {
  return id
    ? `<span class="m23-pill m23-reserved" title="专属库存：只能发给该客户">专属 ${esc(customerName(id))}</span>`
    : '<span class="m23-pill m23-common" title="通用库存：任意客户均可出库">通用</span>';
}
function statusCell(s) {
  if (!s) return '<span class="muted">—</span>';
  const cls = s === "冻结" ? "m23-frozen" : (s === "质检" ? "m23-qc" : "m23-common");
  return `<span class="m23-pill ${cls}">${esc(s)}</span>`;
}

async function loadCustomers() {
  try {
    const d = await api("GET", "/api/customers?page_size=200");
    (d.customers || []).forEach(c => { customerMap[c.id] = c; });
    const sel = document.getElementById("customerFilter");
    const cur = sel.value;
    sel.innerHTML = '<option value="">全部客户归属</option>' +
      (d.customers || []).map(c =>
        `<option value="${c.id}">${esc(c.code)} · ${esc(c.name)}</option>`).join("");
    sel.value = cur;
  } catch (e) { /* 客户主数据不可用时退化为显示 ID，不阻断库存查询 */ }
}

async function load() {
  const qs = inventoryFilterParams(filterForm);
  if (linkedProduct) qs.set("product_id", linkedProduct);
  qs.set("page", page);
  qs.set("page_size", pageSize);
  try {
    const d = await api("GET", "/api/stock/batch?" + qs);
    document.getElementById("tbody").innerHTML = d.stock_batches.map((r) =>
      `<tr>
        <td class="inventory-anchor"><b>${esc(r.product_name)}</b><div class="muted">${esc(r.sku)}</div></td>
        <td>${esc(r.owner_name)}</td><td>${esc(r.spec || "—")}</td><td>${esc(r.unit || "—")}</td>
        <td>${esc(r.location_code)} · ${esc(r.location_name)}</td>
        <td>${esc(r.batch_no || "—")}</td>
        <td>${r.qty}</td><td>${r.allocated_qty}</td><td>${r.available_qty}</td>
        <td>${statusCell(r.stock_status)}</td>
        <td>${reservedPill(r.designated_customer_id)}</td>
        <td>${esc(r.external_batch_no || "—")}</td>
        <td>${r.asn_id ? "#" + r.asn_id : "—"}</td>
        ${stockFields.map(field => `<td>${esc(r.batch_info[field.name] || "—")}</td>`).join("")}
      </tr>`).join("") || `<tr><td colspan="${13 + stockFields.length}" class="muted">暂无批次库存明细</td></tr>`;
    document.getElementById("pageInfo").textContent = `第 ${d.page} 页 / 共 ${d.total} 条`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page * pageSize >= d.total;
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

async function reconcile() {
  const box = document.getElementById("reconcileBox");
  box.innerHTML = "<span>核对中…</span>";
  try {
    const i1 = await api("GET", "/api/stock/reconcile");
    const both = await api("GET", "/api/stock/batch-reconcile");
    const seg = (label, ok, n) =>
      `<span class="${ok ? "ok" : "bad"}">${label} ${ok ? "通过" : "不一致"}（${n} 条异常）</span>`;
    box.innerHTML =
      seg("I1 主账=流水", i1.consistent, (i1.mismatches || []).length) +
      seg("I2 明细=批次流水", both.i2 && !both.i2.mismatches.length,
          both.i2 ? both.i2.mismatches.length : 0) +
      seg("I3 主账=明细", both.i3 && !both.i3.mismatches.length,
          both.i3 ? both.i3.mismatches.length : 0);
    if (!both.consistent) {
      showMsg(document.getElementById("msg"),
        "账目不一致：" + (both.mismatches[0] ? both.mismatches[0].issue : "未知"), "error");
    } else {
      showMsg(document.getElementById("msg"), "三条不变式全部通过", "success");
    }
  } catch (e) {
    box.innerHTML = "";
    showMsg(document.getElementById("msg"), "核对失败：" + e.message, "error");
  }
}

function turn(d) { page += d; load(); }
document.getElementById("tbody").addEventListener("click", e => {
  if (e.target.closest("td")) e.target.closest("tr").classList.toggle("inventory-marked");
});
filterForm.addEventListener("submit", e => {
  e.preventDefault();
  if (document.getElementById("batchProduct").value.trim()) { linkedProduct = null; linkedNotice.hidden = true; }
  page = 1;
  load();
});
filterForm.addEventListener("reset", () => setTimeout(() => {
  linkedProduct = null;
  linkedNotice.hidden = true;
  page = 1;
  load();
}));
Promise.all([
  loadBatchFields(),
  fillInventorySelect("batchOwner", "owners", "全部货主", o => o.name),
  fillInventorySelect("batchLocation", "locations", "全部货位", l => l.code),
  loadCustomers(),
]).then(([fields]) => {
  stockFields = fields;
  for (const field of fields) {
    const th = document.createElement("th");
    th.textContent = field.label;
    document.querySelector(".inventory-grid thead tr").appendChild(th);
    document.getElementById("batchFieldFilter").add(new Option(field.label, field.name));
  }
  load();
}).catch(e => showMsg(document.getElementById("msg"), "加载筛选失败：" + e.message, "error"));
</script>
</body>
</html>
