<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拆单合单 - MiniWMS</title>
<link rel="stylesheet" href="/miniwms/css/style.css">
<style>
.hint { font-size:13px; line-height:1.7; color:var(--text-muted,#666); margin:0 0 12px; }
.dim { font-size:12px; color:#64748b; }
.stat { display:inline-block; min-width:118px; padding:8px 12px; margin:0 8px 8px 0;
  border:1px solid #e2e8f0; border-radius:8px; background:#f8fafc; font-size:12px; color:#475569; }
.stat b { display:block; font-size:18px; color:#0f172a; margin-top:3px; }
.tag.ok { background:#e6f6ec; color:#1d7a4d; }
.tag.warn { background:#fff7ed; color:#9a3412; }
.tag.info { background:#e0f2fe; color:#075985; }
.tag.off { background:#f1f5f9; color:#64748b; }
.tag.danger { background:#fee2e2; color:#991b1b; }
.form-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px 14px; }
.form-grid label { font-size:12px; color:#475569; display:block; }
.form-grid select, .form-grid input { width:100%; box-sizing:border-box; }
.panel { padding:10px 12px; border:1px solid #e2e8f0; border-radius:8px; background:#f8fafc; margin:10px 0; }
.split-line { display:grid; grid-template-columns:1fr 120px 1fr; gap:8px; align-items:center; margin:6px 0; }
.src-row { cursor:pointer; }
.src-row:hover { background:#f8fafc; }
.src-row.sel { background:#e0f2fe; }
.chk { width:auto; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>拆单合单</h1><div class="crumb">MiniWMS / 仓储作业 / 出库单据 / 拆单合单</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>

      <div class="card">
        <div class="card-head"><h2>可拆合出库单</h2>
          <button class="btn secondary sm" onclick="loadCandidates()">刷新</button></div>
        <p class="hint">
          只对<b>未拣货的 open 出库单</b>可拆合：拆单按明细行拆出数量生成新单、源单扣减；
          合单把多张<b>同货主同客户</b>的单据按物料汇总成一张、源单作废。
          全过程<b>不动库存、不写流水</b>，数量守恒，仅留痕追溯。
        </p>
        <div class="table-wrap"><table>
          <thead><tr><th style="width:36px">选</th><th>出库单号</th><th>货主</th><th>客户</th>
            <th>类型</th><th>行/量</th><th>可拆合</th><th>建单时间</th></tr></thead>
          <tbody id="candBody"></tbody>
        </table></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>拆单</h2></div>
        <div class="form-grid">
          <label>源单<select id="splitSource" onchange="renderSplitLines()"></select></label>
          <label>拆分模式<select id="splitMode"></select></label>
          <label>备注<input id="splitNote" placeholder="选填，如 分批发运"></label>
        </div>
        <div class="panel">
          <div class="dim">按明细行填写拆出数量（≤ 可拆量）；每一行生成一个子单。留空或 0 的行不拆。</div>
          <div id="splitLines"></div>
          <button class="btn primary sm" style="margin-top:8px" onclick="doSplit()">确认拆单</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>合单</h2></div>
        <p class="hint">在上表勾选<b>至少 2 张</b>同货主同客户的可拆合单据，确认后合并为一张新单，源单作废。</p>
        <div class="panel">
          <label>备注（选填）<input id="mergeNote" placeholder="如 同客户小单合并拣货"></label>
          <button class="btn primary sm" style="margin-top:8px" onclick="doMerge()">确认合单</button>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>拆合留痕 <span id="logTotal" class="dim"></span></h2>
          <button class="btn secondary sm" onclick="loadLogs(1)">刷新</button></div>
        <div class="toolbar">
          <label class="muted text-sm">动作</label><select id="logAction" onchange="loadLogs(1)"></select>
          <input id="logKeyword" placeholder="单号关键字" style="width:200px">
          <button class="btn secondary sm" onclick="loadLogs(1)">查询</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>动作</th><th>货主</th><th>源单</th><th>目标单</th>
            <th>数量明细</th><th>操作人</th><th>备注</th><th>时间</th></tr></thead>
          <tbody id="logBody"></tbody>
        </table></div>
        <div class="toolbar" style="margin-top:8px">
          <button class="btn secondary sm" onclick="loadLogs(logPage-1)">上一页</button>
          <span id="logPageInfo" class="dim"></span>
          <button class="btn secondary sm" onclick="loadLogs(logPage+1)">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/miniwms/js/preview-api.js?v=22fecd47980b"></script>
<script src="/miniwms/js/api.js"></script>
<script src="/miniwms/js/layout.js"></script>
<script>
let D = { actions:[], modes:[] };
let cand = [], selected = new Set(), logPage = 1, DICT = {};

function msg(text, kind) { showMsg(document.getElementById("msg"), text, kind || "success"); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
function emptyRow(id, colspan, text) {
  document.getElementById(id).innerHTML = `<tr><td colspan="${colspan}" class="muted">${esc(text)}</td></tr>`;
}
function tag(text, cls) { return `<span class="tag ${cls||"off"}">${esc(text)}</span>`; }

async function loadDict() {
  D = await api("GET", "/api/dn-order/dict");
  document.getElementById("splitMode").innerHTML = D.modes
    .map((x) => `<option value="${esc(x.value)}">${esc(x.label)}</option>`).join("");
  document.getElementById("logAction").innerHTML =
    `<option value="">全部</option>` + D.actions
      .map((x) => `<option value="${esc(x.value)}">${esc(x.label)}</option>`).join("");
}

async function loadCandidates() {
  const r = await api("GET", "/api/dn-order/candidates");
  cand = r.candidates || [];
  const body = document.getElementById("candBody");
  if (!cand.length) { emptyRow("candBody", 8, "暂无可拆合出库单（需 open 且未拣货）"); }
  else {
    body.innerHTML = cand.map((d) => `<tr class="src-row">
      <td><input type="checkbox" class="chk" data-id="${d.id}" ${d.splittable?"":"disabled"}
           ${selected.has(d.id)?"checked":""} onchange="toggleSel(${d.id}, this.checked)"></td>
      <td><b>${esc(d.code)}</b></td><td>${esc(d.owner_name||d.owner_code)}</td>
      <td>${esc(d.customer_name||d.customer_code||"—")}</td><td>${esc(d.doc_type)}</td>
      <td>${d.category_count} 行 / ${d.total_qty}</td>
      <td>${d.splittable?tag("可拆合","ok"):tag("已拣货","warn")}</td>
      <td class="dim">${esc(d.created_at||"")}</td></tr>`).join("");
  }
  const sel = document.getElementById("splitSource");
  const opts = cand.filter((d) => d.splittable);
  const prev = sel.value;
  sel.innerHTML = opts.map((d) => `<option value="${d.id}">${esc(d.code)} · ${esc(d.owner_name||"")} · ${d.total_qty}</option>`).join("");
  if (prev && opts.some((d) => String(d.id) === prev)) sel.value = prev;
  renderSplitLines();
}

function toggleSel(id, on) { if (on) selected.add(id); else selected.delete(id); }

async function renderSplitLines() {
  const id = Number(document.getElementById("splitSource").value || 0);
  const box = document.getElementById("splitLines");
  if (!id) { box.innerHTML = '<div class="dim">请先选择源单</div>'; return; }
  const r = await api("GET", `/api/dns/${id}`);
  const mode = document.getElementById("splitMode").value;
  if (!r.lines || !r.lines.length) { box.innerHTML = '<div class="dim">该单无明细</div>'; return; }
  const def = mode === "by_line" ? (l) => l.ordered_qty : (l) => 0;
  box.innerHTML = r.lines.map((l) => `<div class="split-line" data-line="${l.product_id}">
    <span>物料 ${l.product_id} ${esc(l.product_name||l.sku||"")} · 可拆 <b>${l.ordered_qty}</b></span>
    <input type="number" step="0.000001" min="0" max="${l.ordered_qty}" value="${def(l)}"
           id="qty_${l.product_id}" class="qty-input">
    <span class="dim">拆出数量（0 = 不拆）</span></div>`).join("");
}

async function doSplit() {
  const source_id = Number(document.getElementById("splitSource").value || 0);
  if (!source_id) { msg("请选择源单", "error"); return; }
  const r = await api("GET", `/api/dns/${source_id}`);
  const lines = [];
  for (const l of (r.lines || [])) {
    const el = document.getElementById(`qty_${l.product_id}`);
    const q = el ? Number(el.value || 0) : 0;
    if (q > 0) lines.push({ product_id: l.product_id, qty: q });
  }
  if (!lines.length) { msg("请至少填写一个拆出数量", "error"); return; }
  try {
    const res = await api("POST", "/api/dn-order/split", {
      source_id, parts: [{ lines }], note: document.getElementById("splitNote").value });
    msg(`拆单成功：生成 ${res.targets.length} 张子单，源单余 ${res.source.total_qty}`);
    await loadCandidates(); await loadLogs(1);
  } catch (e) { msg("拆单失败：" + (e.error || e.message), "error"); }
}

async function doMerge() {
  const ids = [...selected];
  if (ids.length < 2) { msg("请勾选至少 2 张单据", "error"); return; }
  try {
    const res = await api("POST", "/api/dn-order/merge", {
      source_ids: ids, note: document.getElementById("mergeNote").value });
    selected.clear();
    msg(`合单成功：${res.target.code} 共 ${res.total_qty}`);
    await loadCandidates(); await loadLogs(1);
  } catch (e) { msg("合单失败：" + (e.error || e.message), "error"); }
}

async function loadLogs(page) {
  logPage = page;
  const action = document.getElementById("logAction").value;
  const keyword = document.getElementById("logKeyword").value.trim();
  const q = `?page=${page}&page_size=20${action?`&action=${encodeURIComponent(action)}`:""}${keyword?`&keyword=${encodeURIComponent(keyword)}`:""}`;
  const r = await api("GET", "/api/dn-order/log" + q);
  document.getElementById("logTotal").textContent = `共 ${r.total} 条`;
  document.getElementById("logPageInfo").textContent = `第 ${r.page} / ${Math.max(1, Math.ceil(r.total/r.page_size))} 页`;
  const body = document.getElementById("logBody");
  if (!r.logs.length) { emptyRow("logBody", 9, "暂无留痕"); return; }
  const actionCls = { split:"info", merge:"ok" };
  body.innerHTML = r.logs.map((l) => {
    const rows = (l.detail_rows||[]).map((d) => `物料${d.product_id}×${d.qty}`).join("、");
    return `<tr><td>${l.id}</td><td>${tag(l.action==="split"?"拆单":"合单", actionCls[l.action])}</td>
      <td>${esc(l.owner_code||l.owner_id)}</td><td class="dim">${esc(l.source_codes)}</td>
      <td><b>${esc(l.target_codes)}</b></td><td class="dim" title="${esc(rows)}">${esc(rows.slice(0,40))}${rows.length>40?"…":""}</td>
      <td>${esc(l.operator||"—")}</td><td class="dim">${esc(l.note||"")}</td>
      <td class="dim">${esc(l.created_at)}</td></tr>`;
  }).join("");
}

async function init() {
  await loadDict();
  await Promise.all([loadCandidates(), loadLogs(1)]);
}
window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
