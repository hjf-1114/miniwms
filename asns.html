<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收货管理 - MiniWMS</title>
<link rel="stylesheet" href="/miniwms/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>收货作业</h1><div class="crumb">MiniWMS / 出入库作业</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card" id="asnListCard">
    <div class="card-head">
      <h2>入库单列表</h2>
      <div class="inbound-actions">
        <button class="btn secondary" onclick="openWorkTab('批次','/miniwms/batches.html')">批次管理</button>
        <button class="btn" onclick="openCreate()">+ 新建收货单</button>
      </div>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="单号搜索">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="open">待收货</option>
        <option value="receiving">收货中</option>
        <option value="putaway">待上架 / 上架中</option>
        <option value="closed">已完成</option>
        <option value="cancelled">已取消</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
      <div class="table-wrap inventory-grid" tabindex="0" role="region" aria-label="入库单列表，可横向滚动">
      <table>
      <thead><tr><th class="inventory-anchor">单号</th><th>单据状态</th><th>收货进度</th><th>验收进度</th><th>上架进度</th>
        <th>订单总量</th><th title="累计点收量包含后来取消的点收数量">收货总量</th><th>验收总量</th><th>上架总量</th><th>待上架</th><th>取消总量</th>
        <th>客户</th><th>货主</th><th>入库仓库</th><th>供应商</th><th>单据类型</th><th>品类数</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <div class="card-head">
      <h2 id="detailTitle">入库单明细</h2>
      <div class="inbound-actions">
        <button class="btn" id="detailReceive" onclick="openReceiveTab()">去验收</button>
        <button class="btn secondary" id="detailPutaway" onclick="openPutawayTab()">去上架</button>
        <button class="btn secondary" onclick="refreshDetail()">刷新</button>
        <button class="btn secondary" onclick="showWorkHistory()">作业明细</button>
        <details class="inbound-more" id="detailFinish">
          <summary class="btn secondary">更多</summary>
          <button class="btn danger sm" onclick="finishAsn(currentAsn.asn.id)">完结入库单</button>
        </details>
      </div>
    </div>
    <div class="table-wrap">
      <table><tbody id="asnMeta"></tbody></table>
    </div>
    <div class="table-wrap mt12 inbound-detail-grid">
      <table>
      <thead><tr>
        <th>行</th><th>货品名称</th><th>规格</th><th>货号</th><th>数量</th><th>单位</th>
        <th>厂家</th><th>批号</th><th>生产日期</th><th>失效日期</th>
        <th>注册证号</th><th>注册人/备案人</th><th>生产许可证</th>
        <th>待点收</th><th>已点收</th><th>待验收</th><th>已验收</th><th>已上架</th><th>取消数量</th><th>可入库</th><th class="inbound-line-actions">操作</th>
      </tr></thead>
      <tbody id="lineBody"></tbody>
    </table>
    </div>
  </div>
  <dialog id="workHistory" class="inbound-history" aria-labelledby="workHistoryTitle">
    <div class="card-head">
      <h2 id="workHistoryTitle">作业明细</h2>
      <form method="dialog"><button class="btn secondary sm">关闭</button></form>
    </div>
    <div class="toolbar">
      <label>作业环节 <select id="workHistoryStage">
        <option value="">全部</option>
        <option value="0">收货点收</option>
        <option value="1">验收入库</option>
        <option value="2">上架</option>
        <option value="3">取消</option>
      </select></label>
    </div>
    <div id="workHistoryBody"></div>
  </dialog>
</div>
      </div>
    </div>

    <script src="/miniwms/js/preview-api.js?v=a3c8e5cf89f0"></script>
<script src="/miniwms/js/api.js"></script>
    <script src="/miniwms/js/modal.js"></script>
    <script src="/miniwms/js/order_lines.js"></script>
    <script src="/miniwms/js/layout.js"></script>
    <script src="/miniwms/js/batch_details.js"></script>
    <script src="/miniwms/js/asn_filters.js"></script>
<script>
let currentAsn = null;
let ownerOptions = [], productOptions = [], allSupplierOptions = [];
let allCustomerOptions = [];
let productMap = {}, supplierMap = {}, customerMap = {};
let asnList = [];
let modalEl = null;

async function loadOptions() {
  const [owners, products, suppliers, customers] = await Promise.all(
    ["owners", "products", "suppliers", "customers"].map(fetchOptions)
  );
  ownerOptions = owners.map((o) => ({ value: o.id, label: `${o.code} · ${o.name}` }));
  const ownerCode = (id) => {
    const o = ownerOptions.find((x) => String(x.value) === String(id));
    return o ? o.label.split(" · ")[0] : "—";
  };
  allSupplierOptions = suppliers.map((s) => ({
    value: s.id, label: `${s.code} · ${s.name}〔${ownerCode(s.owner_id)}〕`, owner_id: s.owner_id,
  }));
  supplierMap = Object.fromEntries(suppliers.map((s) => [s.id, s]));
  allCustomerOptions = customers.map((c) => ({
    value: c.id, label: `${c.code} · ${c.name}〔${ownerCode(c.owner_id)}〕`, owner_id: c.owner_id,
  }));
  customerMap = Object.fromEntries(customers.map((c) => [c.id, c]));
  productOptions = products.map((p) => ({
    value: p.id, label: `${p.sku} · ${p.name}〔${ownerCode(p.owner_id)}〕`, owner_id: p.owner_id,
  }));
  productMap = Object.fromEntries(products.map((p) => [p.id, p]));
}

function validateLinesOwner(ov, oid) {
  ov.querySelectorAll(".line-row").forEach((row) => {
    const sel = row.querySelector('[name="product_id"]');
    const box = row.querySelector(".line-err");
    if (!sel || !box) return;
    const p = productMap[sel.value];
    if (oid && p && p.owner_id && String(p.owner_id) !== String(oid)) {
      box.textContent = `⚠ 商品归属货主 ${ownerCodeOf(p.owner_id)}，与单据货主 ${ownerCodeOf(oid)} 不一致，提交将被拒绝`;
      box.classList.add("show");
    } else {
      box.textContent = "";
      box.classList.remove("show");
    }
  });
}

function ownerCodeOf(id) {
  const o = ownerOptions.find((x) => String(x.value) === String(id));
  return o ? o.label.split(" · ")[0] : "—";
}

function validateScoped(ov) {
  const oid = ov.querySelector('[name="owner_id"]').value;
  [["supplier_id", allSupplierOptions, "供应商"],
   ["customer_id", allCustomerOptions, "客户"]].forEach(([name, opts, label]) => {
    const sel = ov.querySelector(`[name="${name}"]`);
    if (!sel || !sel.value) { setFieldError(ov, name, ""); return; }
    const item = opts.find((x) => String(x.value) === String(sel.value));
    if (oid && item && item.owner_id && String(item.owner_id) !== String(oid)) {
      setFieldError(ov, name,
        `⚠ ${label}归属货主 ${ownerCodeOf(item.owner_id)}，与当前货主 ${ownerCodeOf(oid)} 不一致，提交将被拒绝`);
    } else {
      setFieldError(ov, name, "");
    }
  });
  validateLinesOwner(ov, oid);
}

function fillIfEmpty(ov, name, val) {
  const el = ov.querySelector(`[name="${name}"]`);
  if (el && !el.value && val) el.value = val;
}

function bindLinkage(ov) {
  const ownerSel = ov.querySelector('[name="owner_id"]');
  const supSel = ov.querySelector('[name="supplier_id"]');
  const cusSel = ov.querySelector('[name="customer_id"]');

  // M23 条件字段：只有「销退」才需要外部批次号，选其他类型自动隐藏并清空脏值。
  const docSel = ov.querySelector('[name="doc_type"]');
  const extInput = ov.querySelector('[name="external_batch_no"]');
  const extWrap = extInput ? extInput.parentElement : null;
  let extHint = null, slashBtn = null;
  if (extWrap) {
    extHint = document.createElement("div");
    extHint.className = "field-help";
    extHint.style.cssText = "color:#b45309;font-size:12px;margin-top:4px";
    extWrap.appendChild(extHint);
    slashBtn = document.createElement("button");
    slashBtn.type = "button";
    slashBtn.className = "btn secondary sm";
    slashBtn.textContent = "填 /（确实没有）";
    slashBtn.style.marginTop = "6px";
    extWrap.appendChild(slashBtn);
  }
  const syncDoc = () => {
    const isReturn = !!(docSel && docSel.value === "销退");
    if (extWrap) extWrap.style.display = isReturn ? "" : "none";
    if (!isReturn && extInput) extInput.value = "";
    if (extHint) extHint.textContent = isReturn
      ? "必填 · 该值作为所有明细行的默认值，验收时可逐行修改"
      : "";
    if (slashBtn) slashBtn.style.display = isReturn ? "" : "none";
  };
  if (slashBtn) slashBtn.addEventListener("click", () => {
    extInput.value = "/";
    syncDoc();
    extInput.focus();
  });
  if (docSel) docSel.addEventListener("change", syncDoc);
  syncDoc();

  const sync = () => {
    const oid = ownerSel.value;
    const previousSupplier = supSel.value;
    const previousCustomer = cusSel.value;
    filterOwnerOptions(supSel, allSupplierOptions, oid);
    filterOwnerOptions(cusSel, allCustomerOptions, oid);
    for (const [key, previous, selection] of [["supplier", previousSupplier, supSel], ["customer", previousCustomer, cusSel]]) {
      if (!previous || selection.value) continue;
      for (const suffix of ["name", "contact", "phone", "address"]) {
        const field = ov.querySelector(`[name="${key}_${suffix}"]`);
        if (field) field.value = "";
      }
    }
    for (const row of ov.querySelectorAll(".line-row")) {
      const select = row.querySelector('[name="product_id"]');
      const previous = select.value;
      filterOwnerOptions(select, productOptions, oid);
      filterOwnerOptions(row.querySelector('[name="designated_customer_id"]'), allCustomerOptions, oid);
      if (previous && !select.value) {
        for (const f of [...SNAP_FIELDS, ...BATCH_FIELDS]) {
          const field = row.querySelector(`[name="${f.name}"]`);
          if (field) field.value = f.name === "goods_property" ? "合格" : "";
        }
      }
    }
    validateScoped(ov);
  };
  ownerSel.addEventListener("change", sync);
  supSel.addEventListener("change", () => {
    const s = supplierMap[supSel.value];
    if (s) {
      fillIfEmpty(ov, "supplier_contact", s.contact);
      fillIfEmpty(ov, "supplier_phone", s.phone);
      fillIfEmpty(ov, "supplier_address", s.address);
    }
    validateScoped(ov);
  });
  cusSel.addEventListener("change", () => {
    const c = customerMap[cusSel.value];
    if (c) {
      fillIfEmpty(ov, "customer_name", c.name);
      fillIfEmpty(ov, "customer_contact", c.contact);
      fillIfEmpty(ov, "customer_phone", c.phone);
      fillIfEmpty(ov, "customer_address", c.address);
    }
    validateScoped(ov);
  });
  sync();
}

function asnTabTitle(kind) {
  const suffix = currentAsn && currentAsn.asn ? currentAsn.asn.code : (asnIdParam() || "收货单");
  return kind + " · " + suffix;
}

function asnIdParam() {
  const m = /[?&]detail=(\d+)/.exec(location.search || "");
  return m ? m[1] : "";
}

/** 打开验收作业标签页；带 line_id 时作业页会默认选中该明细行。 */
function openReceiveTab(lineId) {
  const id = currentAsn && currentAsn.asn ? currentAsn.asn.id : asnIdParam();
  if (!id) { showMsg(document.getElementById("msg"), "请先打开一张收货单明细", "error"); return; }
  const url = `/miniwms/asn_receive.html?asn_id=${id}` + (lineId ? `&line_id=${lineId}` : "");
  openWorkTab(asnTabTitle("验收") + (lineId ? ` #${lineId}` : ""), url);
}

/** 打开上架作业标签页（含推荐货位与一键采纳）。 */
function openPutawayTab(lineId) {
  const id = currentAsn && currentAsn.asn ? currentAsn.asn.id : asnIdParam();
  if (!id) { showMsg(document.getElementById("msg"), "请先打开一张收货单明细", "error"); return; }
  const url = `/miniwms/asn_putaway.html?asn_id=${id}` + (lineId ? `&line_id=${lineId}` : "");
  openWorkTab(asnTabTitle("上架") + (lineId ? ` #${lineId}` : ""), url);
}

async function refreshDetail() {
  if (currentAsn && currentAsn.asn) await showDetail(currentAsn.asn.id);
  load();
}

async function load() {
  try {
    const kw = document.getElementById("kw").value.trim();
    const st = document.getElementById("statusFilter").value;
    const qs = new URLSearchParams({ page_size: 50 });
    if (kw) qs.set("keyword", kw);
    if (st) qs.set("status", st);
    const data = await api("GET", "/api/asns?" + qs);
    asnList = data.asns;
    document.getElementById("tbody").innerHTML = data.asns.map((a) =>
      `<tr>
        <td class="inventory-anchor"><button class="btn secondary sm" onclick="openAsnDetail(${a.id})">${esc(a.code)}</button></td>
        <td>${asnStatusTag(a.status, a.putaway_total_qty)}</td>
        <td>${inboundStageTag(a.net_counted_qty, a.order_qty - a.cancelled_total_qty, ["未收货", "部分收货", "已收货"])}</td>
        <td>${inboundStageTag(a.accepted_total_qty, a.order_qty - a.cancelled_total_qty, ["未验收", "部分验收", "已验收"])}</td>
        <td>${inboundStageTag(a.putaway_total_qty, a.accepted_total_qty, ["未上架", "部分上架", "已上架"])}</td>
        <td>${a.order_qty}</td><td>${a.counted_total_qty}</td><td>${a.accepted_total_qty}</td>
        <td>${a.putaway_total_qty}</td><td>${a.pending_putaway_qty}</td><td>${a.cancelled_total_qty}</td>
        <td>${esc(a.customer_display_name || "—")}${a.customer_phone ? `<div class="muted">${esc(a.customer_phone)}</div>` : ""}</td>
        <td>${esc(a.owner_name || a.owner_code || "—")}</td>
        <td>${esc(a.source_warehouse_name || a.source_warehouse_code || "—")}</td>
        <td>${esc(a.supplier_display_name || "—")}</td>
        <td>${esc(a.doc_type || "")}</td>
        <td>${a.category_count ?? 0}</td>
        <td class="muted">${esc(a.created_at)}</td>
        <td class="muted">${esc(a.updated_at || "—")}</td>
      <td><div class="inbound-actions">
          <button class="btn secondary sm" onclick="openAsnDetail(${a.id})">明细</button>
          <details class="inbound-more"><summary class="btn secondary sm">更多</summary>
            <button class="btn secondary sm" onclick="openWorkTab('打印收货单','/miniwms/print_preview.html?node=receive&source=asn&doc_id=${a.id}')">打印</button>
            ${["open", "receiving"].includes(a.status) ? `<button class="btn secondary sm" onclick="finishAsn(${a.id})">完结</button>` : ""}
          </details>
        </div>
        </td>
      </tr>`).join("") || '<tr><td colspan="20" class="muted">暂无符合条件的入库单</td></tr>';
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

async function showDetail(id) {
  const data = await api("GET", "/api/asns/" + id);
  currentAsn = data;
  document.getElementById("detailCard").style.display = "";
  document.getElementById("detailTitle").textContent =
    `入库单明细：${data.asn.code}（${asnStatusLabel(data.asn.status, asnPlacedQty(data.lines))}）`;
  const a = data.asn;
  document.getElementById("asnMeta").innerHTML = [
    ["单据类型", a.doc_type || "-", "外部单号", a.external_no || "-"],
    ["外部单据类别", a.external_doc_type || "-", "单据标识", docFlagsText(a)],
    ["原内部批次号", a.doc_type === "销退" ? (a.external_batch_no || "-") : "非销退不适用",
     "专属库存口径", "明细行「指定客户」留空＝通用库存"],
    ["入库仓库", a.source_warehouse_name || (a.source_warehouse_code || "-"), "订单来源", a.order_source || "-"],
    ["供应商", a.supplier_name || "-", "客户", a.customer_name || "-"],
    ["供应商联系人", a.supplier_contact || "-", "供应商电话", a.supplier_phone || "-"],
    ["供应商地址", a.supplier_address || "-", "客户联系人", a.customer_contact || "-"],
    ["客户电话", a.customer_phone || "-", "客户地址", a.customer_address || "-"],
    ["承运商", a.carrier_name || "-", "订单总数量", a.total_qty ?? 0],
    ["品类数", a.category_count ?? 0, "自定义1", a.extra1 || "-"],
    ["自定义2", a.extra2 || "-", "自定义3", a.extra3 || "-"],
    ["备注", a.note || "-", "", ""],
  ].map(([k1, v1, k2, v2]) =>
    `<tr><td class="muted">${k1}</td><td>${esc(v1)}</td><td class="muted">${k2}</td><td>${esc(v2)}</td></tr>`
  ).join("");
  renderLines();
  const acceptance = document.getElementById("detailReceive");
  const canAccept = data.lines.some(l => l.acceptable_qty > 1e-9);
  acceptance.disabled = !canAccept && !data.lines.some(l => l.received_qty > 1e-9);
  acceptance.textContent = canAccept ? "去验收" : "查看验收明细";
  document.getElementById("detailPutaway").disabled = !data.lines.some(l => l.remaining_putaway > 1e-9);
  document.getElementById("detailFinish").hidden = !["open", "receiving"].includes(a.status);
}

function countLine(id) {
  const asn = currentAsn.asn.id;
  const line = currentAsn.lines.find(l => l.id === id);
  const modal = openForm({
    title: `点收 · ${line.sku} ${line.product_name}`, submitText: "确认点收",
    fields: [{ name: "qty", label: `本次实收（待点收 ${line.remaining_count}）`, type: "number",
      default: line.remaining_count, required: true }],
    onSubmit: async p => {
      const submit = modal.querySelector('[type="submit"]');
      const msg = document.getElementById("msg");
      submit.disabled = true;
      try {
        await api("POST", `/api/asns/${asn}/count`, { line_id: id, qty: p.qty });
        try {
          await showDetail(asn);
          showMsg(msg, "已登记点收数量", "success");
        } catch (e) {
          showMsg(msg, "点收已登记，明细刷新失败：" + e.message, "error");
        }
      } finally {
        submit.disabled = false;
      }
    },
  });
  const qty = modal.querySelector('[name="qty"]');
  qty.step = "any";
  qty.max = line.remaining_count;
}

/** M23：客户 ID → 「编码 · 名称」，避免界面只显示一串数字。 */
function customerName(id) {
  const c = customerMap[id];
  return c ? `${c.code} · ${c.name}` : `客户 #${id}`;
}
function reservedChip(id) {
  return id
    ? `<span style="background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px">专属 ${esc(customerName(id))}</span>`
    : "";
}
function warnChip(w) {
  return w
    ? `<span style="background:#fff7ed;color:#b45309;border:1px solid #fed7aa;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px" title="${esc(w)}">缺外部批次号（已显式登记 /）</span>`
    : "";
}

function renderLines() {
  const d = currentAsn;
  const cell = (v) => esc(v === 0 || v ? v : "-");
  document.getElementById("lineBody").innerHTML = d.lines.map(l => {
    const primary = [];
    const secondary = [];
    if (l.remaining_count > 1e-9 && ["open", "receiving"].includes(d.asn.status)) {
      primary.push(["点收", `countLine(${l.id})`]);
      secondary.push(["取消待点收", `cancelLine(${l.id}, false)`]);
    }
    if (l.pending_acceptance > 1e-9) {
      primary.push(["验收", `openReceiveTab(${l.id})`]);
      secondary.push(["取消收货", `cancelLine(${l.id}, true)`]);
    }
    if (l.remaining_putaway > 1e-9) primary.push(["上架", `openPutawayTab(${l.id})`]);
    const next = primary.shift();
    const more = [...primary, ...secondary];
    return `<tr data-line-id="${l.id}">
      <td>${l.id}</td><td>${esc(l.product_name || l.sku || "")}</td>
      <td>${cell(l.spec)}</td><td>${cell(l.article_no)}</td>
      <td>${l.expected_qty}</td><td>${cell(l.unit)}</td>
      <td>${cell(l.mfg_enterprise)}</td><td>${cell(l.batch_no)}</td>
      <td>${cell(l.production_date)}</td><td>${cell(l.expiry_date)}</td>
      <td>${cell(l.reg_cert_no)}</td><td>${cell(l.registrant)}</td>
      <td>${cell(l.mfg_license)}</td>
      <td>${l.remaining_count}</td><td>${l.counted_qty}</td><td>${l.pending_acceptance}</td>
      <td><b>${l.received_qty}</b></td><td>${l.putaway_qty}</td>
      <td>${l.cancelled_qty}</td><td><b>${l.receivable_qty}</b></td>
      <td class="inbound-line-actions"><div class="inbound-actions">
        ${next ? `<button class="btn sm" onclick="${next[1]}">${next[0]}</button>` : ""}
        <button class="btn secondary sm" onclick="showWorkHistory(${l.id})">作业明细</button>
        ${more.length ? `<details class="inbound-more"><summary class="btn secondary sm">更多</summary>
          ${more.map(([label, action]) => `<button class="btn secondary sm" onclick="${action}">${label}</button>`).join("")}
        </details>` : ""}
      </div></td>
    </tr>`;
  }).join("");
}

async function showWorkHistory(lineId) {
  const order = currentAsn;
  const dialog = document.getElementById("workHistory");
  const body = document.getElementById("workHistoryBody");
  const stage = document.getElementById("workHistoryStage");
  const lines = lineId ? order.lines.filter(l => l.id === lineId) : order.lines;
  document.getElementById("workHistoryTitle").textContent =
    `作业明细 · ${order.asn.code}${lineId ? " / " + lines[0].sku : ""}`;
  stage.value = "";
  stage.onchange = null;
  body.textContent = "加载中…";
  dialog.showModal();
  try {
    const fields = await loadBatchFields();
    const entries = lines.flatMap(l => {
      const unit = esc(l.unit || "");
      return [
      ...l.receiving_counts.map(c => ({ ...c, stage: 0, action: "点收",
        content: `点收 #${c.id} · 实收 ${c.qty} ${unit}
          <div>已验收 ${c.accepted_qty} · 已取消 ${c.cancelled_qty} · 待验收 ${c.remaining}</div>` })),
      ...l.batch_receipts.map(b => ({ ...b, stage: 1, action: "验收入库",
        content: `验收 ${b.qty} ${unit} · 暂存位 ${esc(b.location_code || "—")}
          <div>批次号 ${esc(b.batch_no)} · 厂家批号 ${esc(b.info.batch_no || "—")}</div>
          ${b.receiving_count_id ? `<div>关联点收 #${b.receiving_count_id}</div>` : ""}
          ${b.stock_status ? `<div>库存状态 ${esc(b.stock_status)}</div>` : ""}
          ${reservedChip(b.designated_customer_id)}${warnChip(b.warning)}
          <details><summary>批次详情</summary>${batchDetails(fields, b.info)}</details>` })),
      ...l.putaway_details.map(p => ({ ...p, stage: 2, action: "上架",
        content: `上架 ${p.qty} ${unit} · ${esc(p.from_location_code || "—")} → ${esc(p.to_location_code || "—")}
          <div>批次号 ${esc(p.batch_no || "—")}</div>
          ${p.override_reason ? `<div>改位原因 ${esc(p.override_reason)}</div>` : ""}` })),
      ...l.cancellations.map(c => ({ ...c, stage: 3,
        content: `取消 ${c.qty} ${unit}` })),
      ].map(entry => ({ ...entry, lineLabel: `#${l.id} ${l.sku} · ${l.product_name}` }));
    });
    entries.sort((a, b) => b.created_at.localeCompare(a.created_at) || b.stage - a.stage || b.id - a.id);
    const renderHistory = () => {
      const visible = stage.value === "" ? entries : entries.filter(entry => entry.stage === Number(stage.value));
      body.innerHTML = `<div class="table-wrap"><table class="inbound-history-table">
      <thead><tr><th>操作时间</th><th>操作人</th><th>订单明细</th><th>操作动作</th><th>具体内容</th></tr></thead>
      <tbody>${visible.map(entry => `<tr><td>${esc(entry.created_at)}</td>
        <td>${esc(entry.operator || "未记录")}</td><td>${esc(entry.lineLabel)}</td><td>${esc(entry.action)}</td><td>${entry.content}</td></tr>`).join("") ||
        '<tr><td colspan="5" class="muted">所选环节暂无作业明细</td></tr>'}</tbody>
    </table></div>`;
    };
    stage.onchange = renderHistory;
    renderHistory();
  } catch (e) { body.textContent = "加载失败：" + e.message; }
}

async function finishAsn(id) {
  if (!confirm("完结将取消全部未验收入库的数量。已验收的库存和待上架任务会保留。确认完结？")) return;
  try {
    const result = await api("POST", `/api/asns/${id}/finish`);
    if (currentAsn?.asn.id === id) await showDetail(id);
    else await load();
    const messages = { cancelled: "入库单已取消", closed: "入库单已完成", putaway: "剩余未验收数量已取消，已验收数量待上架" };
    showMsg(document.getElementById("msg"), messages[result.status], "success");
  } catch (e) {
    showMsg(document.getElementById("msg"), "完结失败：" + e.message, "error");
  }
}

function cancelLine(id, received) {
  const line = currentAsn.lines.find(l => l.id === id);
  const limit = received ? line.pending_acceptance : line.remaining_count;
  const action = received ? "取消收货" : "取消待点收";
  const asn = currentAsn.asn.id;
  const modal = openForm({
    title: `${action} · ${line.sku}`, submitText: "确认取消",
    fields: [{ name: "qty", label: `${action}数量（最多 ${limit}）`, type: "number", required: true }],
    onSubmit: async p => {
      const button = modal.querySelector('[type="submit"]');
      button.disabled = true;
      try {
        await api("POST", `/api/asns/${asn}/lines/${id}/${received ? "cancel-receiving" : "cancel"}`, { qty: p.qty });
        try {
          await showDetail(asn);
          showMsg(document.getElementById("msg"), `${action}成功 · ${p.qty}`, "success");
        } catch (e) {
          showMsg(document.getElementById("msg"), `${action}已登记，明细刷新失败：${e.message}`, "warning");
        }
      } finally { button.disabled = false; }
    },
  });
  const input = modal.querySelector('[name="qty"]');
  input.step = "any";
  input.max = limit;
}

async function openCreate() {
  await loadOptions();
  const { current_warehouse: warehouse } = await api("GET", "/api/scope/context");
  if (!warehouse) {
    showMsg(document.getElementById("msg"), "请先在顶部选择当前仓库", "error");
    return;
  }
  const fields = [
    { type: "section", label: "① 单据信息" },
    { name: "code", label: "单号（留空自动生成 ASN-日期-流水）", autocode: true, autocodePrefix: "ASN" },
    { name: "owner_id", label: "货主 *", type: "select", required: true,
      placeholder: "请选择货主", options: ownerOptions,
      help: "先选择委托方，再选择该委托方的供应商、客户和商品" },
    { name: "doc_type", label: "单据类型", type: "select", default: "采购", options: [
      { value: "采购", label: "采购" }, { value: "调拨", label: "调拨" },
      { value: "销退", label: "销退" }, { value: "期初", label: "期初" },
      { value: "其他", label: "其他" },
    ] },
    { name: "external_batch_no", label: "原内部批次号（销退必填）",
      help: "销退单由外部传入原出库内部批次号，作为全单默认值；验收时可逐行改。确实没有请填 / 表示「无」，系统会记录告警并回溯历史批次。" },
    { name: "external_no", label: "外部单号" },
    { name: "order_source", label: "订单来源" },
    { name: "warehouse_display", label: "入库仓库", readonly: true,
      default: `${warehouse.code} · ${warehouse.name}` },

    { type: "section", label: "单据标识（M20 剩余：仅记录，暂不参与校验）" },
    { name: "external_doc_type", label: "外部单据类别",
      help: "自由文本；M26 上架规则编辑器再提供可配字典与按类别分流" },
    { name: "is_virtual", label: "虚拟", type: "select", default: 0,
      options: [{ value: 0, label: "否" }, { value: 1, label: "是" }] },
    { name: "is_direct", label: "直调", type: "select", default: 0,
      options: [{ value: 0, label: "否" }, { value: 1, label: "是" }] },
    { name: "is_cold_chain", label: "冷链", type: "select", default: 0,
      options: [{ value: 0, label: "否" }, { value: 1, label: "是" }] },
    { name: "is_hazard", label: "危险", type: "select", default: 0,
      options: [{ value: 0, label: "否" }, { value: 1, label: "是" }] },

    { type: "section", label: "② 往来单位（联系方式可在下单时修改）" },
    { name: "supplier_id", label: "供应商", type: "select", placeholder: "请选择供应商", options: allSupplierOptions },
    { name: "supplier_contact", label: "供应商联系人" },
    { name: "supplier_phone", label: "供应商电话" },
    { name: "supplier_address", label: "供应商地址" },
    { name: "customer_id", label: "客户", type: "select", placeholder: "请选择客户", options: allCustomerOptions },
    { name: "customer_name", label: "客户名称（可覆盖）" },
    { name: "customer_contact", label: "客户联系人" },
    { name: "customer_phone", label: "客户电话" },
    { name: "customer_address", label: "客户地址" },
    { name: "carrier_name", label: "承运商" },

    { type: "section", label: "③ 收货明细（选商品自动带出档案，全部字段均可人工编辑；验收入库写入批次信息）" },
    {
      name: "lines", label: "收货明细", type: "lines", full: true, cardLayout: true,
      lineFields: [
        { name: "product_id", label: "商品 *", type: "select", placeholder: "选择商品",
          required: true, options: productOptions, optionData: productData(productMap) },
        { name: "expected_qty", label: "数量 *", type: "number", required: true },
        ...SNAP_FIELDS, ...BATCH_FIELDS,
        // M23：指定客户只在明细行，默认空＝通用库存；有值则该批库存只能发给该客户。
        { name: "designated_customer_id", label: "指定客户（留空＝通用）",
          type: "select", placeholder: "通用库存", options: allCustomerOptions },
      ],
      autoFill: PRODUCT_LINE_AUTOFILL,
      onLineChange: () => {
        if (modalEl) validateLinesOwner(modalEl, modalEl.querySelector('[name="owner_id"]').value);
      },
      onLineAdd: (row) => {
        if (!modalEl) return;
        const oid = modalEl.querySelector('[name="owner_id"]').value;
        filterOwnerOptions(row.querySelector('[name="product_id"]'), productOptions, oid);
        filterOwnerOptions(row.querySelector('[name="designated_customer_id"]'), allCustomerOptions, oid);
        validateLinesOwner(modalEl, oid);
      },
    },

    { type: "section", label: "④ 其他" },
    { name: "extra1", label: "自定义字段1" },
    { name: "extra2", label: "自定义字段2" },
    { name: "extra3", label: "自定义字段3" },
    { name: "note", label: "备注", type: "textarea", full: true },
  ];

  modalEl = openForm({
    title: "新建收货单（ASN）", submitText: "创建", width: 1000, fields,
    onSubmit: async (p) => {
      // M23：销退外部批次号先做前端内联拦截，避免提交后被 400 打断整屏录入。
      if (p.doc_type === "销退" && !String(p.external_batch_no || "").trim()) {
        throw new Error("销退单必须填写「原内部批次号」；确实没有请点「填 /」按钮表示无");
      }
      delete p.warehouse_display;
      await api("POST", "/api/asns", { ...p, source_warehouse: warehouse.id });
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
  bindLinkage(modalEl);
}

function openAsnDetail(id) {
  const r = asnList.find((x) => x.id === id);
  openWorkTab("收货 " + (r ? r.code : id), "/miniwms/asns.html?detail=" + id);
}

const detailId = new URLSearchParams(location.search).get("detail");
document.addEventListener("click", event => {
  const active = event.target.closest(".inbound-more");
  document.querySelectorAll(".inbound-more[open]").forEach(menu => {
    if (menu !== active || event.target.closest("button")) menu.open = false;
  });
});
if (detailId) {
  document.getElementById("asnListCard").hidden = true;
  loadOptions().then(() => showDetail(Number(detailId))).catch(e =>
    showMsg(document.getElementById("msg"), "明细加载失败：" + e.message, "error"));
} else {
  loadOptions().then(load);
}
</script>
