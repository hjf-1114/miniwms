<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收货管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>收货作业</h1><div class="crumb">MiniWMS / 出入库作业</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>收货单列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建收货单</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="单号搜索">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="open">待收货</option>
        <option value="receiving">收货中</option>
        <option value="putaway">上架中</option>
        <option value="closed">已完成</option>
        <option value="cancelled">已取消</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
      <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>单号</th><th>单据类型</th><th>货主</th><th>来源仓库</th><th>供应商</th><th>总数量</th><th>品类数</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <h2 id="detailTitle">收货单明细</h2>
    <div class="toolbar">
      <select id="recvLocSel"></select><span class="muted">← 收货位（收货用）</span>
      <select id="fromLocSel"></select><span class="muted">← 来源暂存位（上架用）</span>
      <select id="toLocSel"></select><span class="muted">← 目标存储/拣货位（上架用）</span>
      <button class="btn secondary" onclick="loadLocs()">刷新库位</button>
    </div>
    <div class="table-wrap">
      <table>
      <tbody id="asnMeta"></tbody>
    </table>
    </div>
    <div class="table-wrap">
      <table>
      <thead><tr><th>行</th><th>SKU</th><th>物料</th><th>预期</th><th>已收</th><th>已上架</th><th>收货</th><th>上架</th></tr></thead>
      <tbody id="lineBody"></tbody>
    </table>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/layout.js"></script>
<script>
let currentAsn = null;
let ownerOptions = [];
let productOptions = [];
let allSupplierOptions = [];
let warehouseOptions = [];

async function loadOptions() {
  const [ow, pr, sp, wh] = await Promise.all([
    api("GET", "/api/owners?page_size=100"),
    api("GET", "/api/products?page_size=100"),
    api("GET", "/api/suppliers?page_size=100"),
    api("GET", "/api/warehouses?page_size=100"),
  ]);
  ownerOptions = ow.owners.map((o) => ({ value: o.id, label: `${o.code} · ${o.name}` }));
  productOptions = pr.products.map((p) => ({ value: p.id, label: `${p.sku} · ${p.name}` }));
  allSupplierOptions = sp.suppliers.map((s) => ({
    value: s.id, label: `${s.code} · ${s.name}`, owner_id: s.owner_id,
  }));
  warehouseOptions = wh.warehouses.map((w) => ({ value: w.id, label: `${w.code} · ${w.name}` }));
}

function suppliersForOwner(ownerId) {
  if (!ownerId) return allSupplierOptions;
  return allSupplierOptions.filter((s) => String(s.owner_id) === String(ownerId));
}

async function loadLocs() {
  const [recv, dest] = await Promise.all([
    api("GET", "/api/locations?loc_type=receiving&status=active&page_size=100"),
    api("GET", "/api/locations?status=active&page_size=100"),
  ]);
  const recvOpts = recv.locations.map(
    (l) => `<option value="${l.id}">${esc(l.code)}（收货区）</option>`).join("");
  const destOpts = dest.locations.filter(
    (l) => l.loc_type === "storage" || l.loc_type === "picking").map(
    (l) => `<option value="${l.id}">${esc(l.code)}（${esc(l.loc_type_label)}）</option>`).join("");
  document.getElementById("recvLocSel").innerHTML = recvOpts;
  document.getElementById("fromLocSel").innerHTML = recvOpts;
  document.getElementById("toLocSel").innerHTML = destOpts;
}

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const st = document.getElementById("statusFilter").value;
  const qs = new URLSearchParams({ page_size: 50 });
  if (kw) qs.set("keyword", kw);
  if (st) qs.set("status", st);
  try {
    const data = await api("GET", "/api/asns?" + qs);
    document.getElementById("tbody").innerHTML = data.asns.map((a) =>
      `<tr>
        <td>${a.id}</td><td>${esc(a.code)}</td>
        <td>${esc(a.doc_type || "")}</td>
        <td>${esc(a.owner_code || "")} · ${esc(a.owner_name || "")}</td>
        <td>${esc(a.source_warehouse_code || "-")}</td>
        <td>${esc(a.supplier_name || "-")}</td>
        <td>${a.total_qty ?? 0}</td>
        <td>${a.category_count ?? 0}</td>
        <td>${asnStatusTag(a.status)}</td>
        <td class="muted">${esc(a.created_at)}</td>
        <td>
          <button class="btn secondary sm" onclick="showDetail(${a.id})">明细</button>
          ${a.status === "open" ? `<button class="btn danger sm" onclick="cancelAsn(${a.id})">取消</button>` : ""}
        </td>
      </tr>`).join("");
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function asnStatusTag(s) {
  const map = { open: "待收货", receiving: "收货中", putaway: "上架中", closed: "已完成", cancelled: "已取消" };
  const cls = s === "closed" ? "ok" : "off";
  return `<span class="tag ${cls}">${map[s] || s}</span>`;
}

async function showDetail(id) {
  const data = await api("GET", "/api/asns/" + id);
  currentAsn = data;
  document.getElementById("detailCard").style.display = "";
  document.getElementById("detailTitle").textContent =
    `收货单明细：${data.asn.code}（${data.asn.status}）`;
  const a = data.asn;
  document.getElementById("asnMeta").innerHTML = [
    ["单据类型", a.doc_type || "-", "外部单号", a.external_no || "-"],
    ["来源仓库", a.source_warehouse_name || (a.source_warehouse_code || "-"), "订单来源", a.order_source || "-"],
    ["供应商", a.supplier_name || "-", "客户名称", a.customer_name || "-"],
    ["供应商联系人", a.supplier_contact || "-", "供应商电话", a.supplier_phone || "-"],
    ["供应商地址", a.supplier_address || "-", "承运商", a.carrier_name || "-"],
    ["订单总数量", a.total_qty ?? 0, "品类数", a.category_count ?? 0],
    ["自定义1", a.extra1 || "-", "自定义2", a.extra2 || "-"],
    ["自定义3", a.extra3 || "-", "备注", a.note || "-"],
  ].map(([k1, v1, k2, v2]) =>
    `<tr><td class="muted">${k1}</td><td>${esc(v1)}</td><td class="muted">${k2}</td><td>${esc(v2)}</td></tr>`
  ).join("");
  await loadLocs();
  renderLines();
}

function renderLines() {
  const d = currentAsn;
  document.getElementById("lineBody").innerHTML = d.lines.map((l) =>
    `<tr>
      <td>${l.id}</td><td>${esc(l.sku)}</td><td>${esc(l.product_name)}</td>
      <td>${l.expected_qty}</td><td><b>${l.received_qty}</b></td><td>${l.putaway_qty}</td>
      <td>
        <input id="rq-${l.id}" type="number" min="0.01" step="0.01" placeholder="数量" style="width:80px">
        <button class="btn sm" onclick="doReceive(${l.id})">收货</button>
      </td>
      <td>
        <input id="pq-${l.id}" type="number" min="0.01" step="0.01" placeholder="数量" style="width:80px">
        <button class="btn secondary sm" onclick="doPutaway(${l.id})">上架</button>
      </td>
    </tr>`).join("");
}

async function doReceive(lineId) {
  const qty = parseFloat(document.getElementById("rq-" + lineId).value);
  const locationId = parseInt(document.getElementById("recvLocSel").value, 10);
  try {
    const r = await api("POST", `/api/asns/${currentAsn.asn.id}/receive`,
      { line_id: lineId, location_id: locationId, qty });
    showMsg(document.getElementById("msg"), `收货成功，单据状态：${r.status}`, "success");
    await showDetail(currentAsn.asn.id);
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "收货失败：" + e.message, "error");
  }
}

async function doPutaway(lineId) {
  const qty = parseFloat(document.getElementById("pq-" + lineId).value);
  const fromId = parseInt(document.getElementById("fromLocSel").value, 10);
  const toId = parseInt(document.getElementById("toLocSel").value, 10);
  try {
    const r = await api("POST", `/api/asns/${currentAsn.asn.id}/putaway`,
      { line_id: lineId, from_location_id: fromId, to_location_id: toId, qty });
    showMsg(document.getElementById("msg"), `上架成功，单据状态：${r.status}`, "success");
    await showDetail(currentAsn.asn.id);
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "上架失败：" + e.message, "error");
  }
}

async function cancelAsn(id) {
  if (!confirm("确认取消该收货单？（仅未收货可取消）")) return;
  try {
    await api("POST", `/api/asns/${id}/cancel`);
    showMsg(document.getElementById("msg"), "已取消", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "取消失败：" + e.message, "error");
  }
}

async function openCreate() {
  await loadOptions();
  openForm({
    title: "新建收货单（ASN）", submitText: "创建", width: 760,
    fields: [
      { name: "code", label: "单号 *（留空自动生成 ASN-日期-流水）", required: false, autocode: true, autocodePrefix: "ASN" },
      { name: "owner_id", label: "货主 *", type: "select", required: true, options: ownerOptions },
      { name: "doc_type", label: "单据类型", type: "select", options: [
        { value: "调拨", label: "调拨" }, { value: "销退", label: "销退" },
        { value: "采购", label: "采购" }, { value: "期初", label: "期初" }, { value: "其他", label: "其他" },
      ] },
      { name: "external_no", label: "外部单号（主单号）" },
      { name: "order_source", label: "订单来源" },
      { name: "source_warehouse", label: "来源仓库", type: "select", options: warehouseOptions },
      { name: "supplier_id", label: "供应商", type: "select", options: allSupplierOptions },
      { name: "customer_name", label: "客户名称" },
      { name: "carrier_name", label: "承运商名称" },
      { name: "extra1", label: "自定义字段1" },
      { name: "extra2", label: "自定义字段2" },
      { name: "extra3", label: "自定义字段3" },
      { name: "note", label: "备注", type: "textarea", full: true },
      {
        name: "lines", label: "收货明细", type: "lines", full: true,
        lineFields: [
          { name: "product_id", label: "物料", type: "select", options: productOptions },
          { name: "expected_qty", label: "预期数量", type: "number" },
        ],
      },
    ],
    onSubmit: async (p) => {
      await api("POST", "/api/asns", p);
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
  // 选择货主后联动过滤供应商（多货主隔离）
  const ov = document.querySelector(".modal-overlay");
  if (ov) {
    const ownerSel = ov.querySelector('[name="owner_id"]');
    const supSel = ov.querySelector('[name="supplier_id"]');
    if (ownerSel && supSel) {
      const sync = () => {
        const list = suppliersForOwner(ownerSel.value);
        const cur = supSel.value;
        supSel.innerHTML = list.map((s) =>
          `<option value="${esc(s.value)}" ${String(s.value) === String(cur) ? "selected" : ""}>${esc(s.label)}</option>`).join("");
      };
      sync();
      ownerSel.addEventListener("change", sync);
    }
  }
}

loadOptions().then(load);
</script>
</body>
</html>
