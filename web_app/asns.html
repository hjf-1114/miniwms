<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收货管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>收货作业</h1><div class="crumb">MiniWMS / 出入库作业</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>收货单列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建收货单</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="单号搜索">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="open">待收货</option>
        <option value="receiving">收货中</option>
        <option value="putaway">上架中</option>
        <option value="closed">已完成</option>
        <option value="cancelled">已取消</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
      <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>单号</th><th>单据类型</th><th>货主</th><th>来源仓库</th><th>供应商</th><th>总数量</th><th>品类数</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <h2 id="detailTitle">收货单明细</h2>
    <div class="toolbar">
      <select id="recvLocSel"></select><span class="muted">← 收货位（收货用）</span>
      <select id="fromLocSel"></select><span class="muted">← 来源暂存位（上架用）</span>
      <select id="toLocSel"></select><span class="muted">← 目标存储/拣货位（上架用）</span>
      <button class="btn secondary" onclick="loadLocs()">刷新库位</button>
    </div>
    <div class="table-wrap">
      <table><tbody id="asnMeta"></tbody></table>
    </div>
    <div class="table-wrap mt12">
      <table>
      <thead><tr>
        <th>行</th><th>货品名称</th><th>规格</th><th>货号</th><th>数量</th><th>单位</th>
        <th>厂家</th><th>批号</th><th>生产日期</th><th>失效日期</th>
        <th>注册证号</th><th>注册人/备案人</th><th>生产许可证</th>
        <th>已收</th><th>已上架</th><th>收货</th><th>上架</th>
      </tr></thead>
      <tbody id="lineBody"></tbody>
    </table>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/layout.js"></script>
<script>
let currentAsn = null;
let ownerOptions = [], productOptions = [], allSupplierOptions = [];
let allCustomerOptions = [], warehouseOptions = [];
let productMap = {}, supplierMap = {}, customerMap = {};
let asnList = [];
let modalEl = null;

// 商品档案字段（选商品时自动带出、随单据留快照）
const SNAP_FIELDS = [
  { name: "product_name", label: "货品名称", readonly: true },
  { name: "spec", label: "规格", readonly: true },
  { name: "article_no", label: "货号", readonly: true },
  { name: "unit", label: "单位", readonly: true },
  { name: "brand", label: "品牌", readonly: true },
  { name: "mfg_enterprise", label: "厂家", readonly: true },
  { name: "reg_cert_no", label: "注册证号", readonly: true },
  { name: "registrant", label: "注册人/备案人", readonly: true },
  { name: "mfg_license", label: "生产许可证", readonly: true },
  { name: "shelf_life_days", label: "效期(天)", readonly: true },
];
const BATCH_FIELDS = [
  { name: "batch_no", label: "批号" },
  { name: "production_date", label: "生产日期", type: "date" },
  { name: "expiry_date", label: "失效日期", type: "date" },
];

async function loadOptions() {
  let [ow, pr, sp, cu, wh] = await Promise.all([
    api("GET", "/api/owners?page_size=100"),
    api("GET", "/api/products?page_size=100"),
    api("GET", "/api/suppliers?page_size=100"),
    api("GET", "/api/customers?page_size=100"),
    api("GET", "/api/warehouses?page_size=100"),
  ]);
  // 仓库默认没有内容时，自动播种一个默认仓库，保证表单可直接选
  if (!wh.warehouses.length) {
    try {
      await api("POST", "/api/warehouses", { code: "WH-DEFAULT", name: "默认仓库" });
      wh = await api("GET", "/api/warehouses?page_size=100");
    } catch (e) { /* 无权限时由表单提示手动创建 */ }
  }
  ownerOptions = ow.owners.map((o) => ({ value: o.id, label: `${o.code} · ${o.name}` }));
  const ownerCode = (id) => {
    const o = ownerOptions.find((x) => String(x.value) === String(id));
    return o ? o.label.split(" · ")[0] : "—";
  };
  allSupplierOptions = sp.suppliers.map((s) => ({
    value: s.id, label: `${s.code} · ${s.name}〔${ownerCode(s.owner_id)}〕`, owner_id: s.owner_id,
  }));
  supplierMap = Object.fromEntries(sp.suppliers.map((s) => [s.id, s]));
  allCustomerOptions = cu.customers.map((c) => ({
    value: c.id, label: `${c.code} · ${c.name}〔${ownerCode(c.owner_id)}〕`, owner_id: c.owner_id,
  }));
  customerMap = Object.fromEntries(cu.customers.map((c) => [c.id, c]));
  warehouseOptions = wh.warehouses.map((w) => ({ value: w.id, label: `${w.code} · ${w.name}` }));
  productOptions = pr.products.map((p) => ({
    value: p.id, label: `${p.sku} · ${p.name}〔${ownerCode(p.owner_id)}〕`, owner_id: p.owner_id,
  }));
  productMap = Object.fromEntries(pr.products.map((p) => [p.id, p]));
}

function productData() {
  const out = {};
  Object.keys(productMap).forEach((id) => {
    const p = productMap[id];
    out[id] = {
      name: p.name || "", spec: p.spec || "", article_no: p.article_no || "",
      unit: p.unit || "", brand: p.brand || "", mfg_enterprise: p.mfg_enterprise || "",
      reg_cert_no: p.reg_cert_no || "", registrant: p.registrant || "",
      mfg_license: p.mfg_license || "", shelf_life_days: p.shelf_life_days || "",
    };
  });
  return out;
}

/** 联动：把符合当前货主的选项排前并打 ✓，但保留全部选项（选错要能报错）。 */
function reorderScoped(sel, opts, oid) {
  if (!sel) return;
  const cur = sel.value;
  const match = (o) => oid && o.owner_id && String(o.owner_id) === String(oid);
  const sorted = opts.slice().sort((a, b) => (match(a) ? 0 : 1) - (match(b) ? 0 : 1));
  sel.innerHTML = `<option value="">请选择…</option>` + sorted.map((o) =>
    `<option value="${esc(o.value)}"${String(o.value) === String(cur) ? " selected" : ""}>${esc(o.label)}${match(o) ? " ✓" : ""}</option>`
  ).join("");
}

function validateLinesOwner(ov, oid) {
  ov.querySelectorAll(".line-row").forEach((row) => {
    const sel = row.querySelector('[name="product_id"]');
    const box = row.querySelector(".line-err");
    if (!sel || !box) return;
    const p = productMap[sel.value];
    if (oid && p && p.owner_id && String(p.owner_id) !== String(oid)) {
      box.textContent = `⚠ 商品归属货主 ${ownerCodeOf(p.owner_id)}，与单据货主 ${ownerCodeOf(oid)} 不一致，提交将被拒绝`;
      box.classList.add("show");
    } else {
      box.textContent = "";
      box.classList.remove("show");
    }
  });
}

function ownerCodeOf(id) {
  const o = ownerOptions.find((x) => String(x.value) === String(id));
  return o ? o.label.split(" · ")[0] : "—";
}

function validateScoped(ov) {
  const oid = ov.querySelector('[name="owner_id"]').value;
  [["supplier_id", allSupplierOptions, "供应商"],
   ["customer_id", allCustomerOptions, "客户"]].forEach(([name, opts, label]) => {
    const sel = ov.querySelector(`[name="${name}"]`);
    if (!sel || !sel.value) { setFieldError(ov, name, ""); return; }
    const item = opts.find((x) => String(x.value) === String(sel.value));
    if (oid && item && item.owner_id && String(item.owner_id) !== String(oid)) {
      setFieldError(ov, name,
        `⚠ ${label}归属货主 ${ownerCodeOf(item.owner_id)}，与当前货主 ${ownerCodeOf(oid)} 不一致，提交将被拒绝`);
    } else {
      setFieldError(ov, name, "");
    }
  });
  validateLinesOwner(ov, oid);
}

function fillIfEmpty(ov, name, val) {
  const el = ov.querySelector(`[name="${name}"]`);
  if (el && !el.value && val) el.value = val;
}

function bindLinkage(ov) {
  const ownerSel = ov.querySelector('[name="owner_id"]');
  const supSel = ov.querySelector('[name="supplier_id"]');
  const cusSel = ov.querySelector('[name="customer_id"]');
  const sync = () => {
    const oid = ownerSel.value;
    reorderScoped(supSel, allSupplierOptions, oid);
    reorderScoped(cusSel, allCustomerOptions, oid);
    ov.querySelectorAll('.line-row [name="product_id"]').forEach(
      (sel) => reorderScoped(sel, productOptions, oid));
    validateScoped(ov);
  };
  ownerSel.addEventListener("change", sync);
  supSel.addEventListener("change", () => {
    const s = supplierMap[supSel.value];
    if (s) {
      fillIfEmpty(ov, "supplier_contact", s.contact);
      fillIfEmpty(ov, "supplier_phone", s.phone);
      fillIfEmpty(ov, "supplier_address", s.address);
    }
    validateScoped(ov);
  });
  cusSel.addEventListener("change", () => {
    const c = customerMap[cusSel.value];
    if (c) {
      fillIfEmpty(ov, "customer_name", c.name);
      fillIfEmpty(ov, "customer_contact", c.contact);
      fillIfEmpty(ov, "customer_phone", c.phone);
      fillIfEmpty(ov, "customer_address", c.address);
    }
    validateScoped(ov);
  });
  sync();
}

async function loadLocs() {
  const [recv, dest] = await Promise.all([
    api("GET", "/api/locations?loc_type=receiving&status=active&page_size=100"),
    api("GET", "/api/locations?status=active&page_size=100"),
  ]);
  const recvOpts = recv.locations.map(
    (l) => `<option value="${l.id}">${esc(l.code)}（收货区）</option>`).join("");
  const destOpts = dest.locations.filter(
    (l) => l.loc_type === "storage" || l.loc_type === "picking").map(
    (l) => `<option value="${l.id}">${esc(l.code)}（${esc(l.loc_type_label)}）</option>`).join("");
  document.getElementById("recvLocSel").innerHTML = recvOpts;
  document.getElementById("fromLocSel").innerHTML = recvOpts;
  document.getElementById("toLocSel").innerHTML = destOpts;
}

async function load() {
  try {
    const kw = document.getElementById("kw").value.trim();
    const st = document.getElementById("statusFilter").value;
    const qs = new URLSearchParams({ page_size: 50 });
    if (kw) qs.set("keyword", kw);
    if (st) qs.set("status", st);
    const data = await api("GET", "/api/asns?" + qs);
    asnList = data.asns;
    document.getElementById("tbody").innerHTML = data.asns.map((a) =>
      `<tr>
        <td>${a.id}</td><td>${esc(a.code)}</td>
        <td>${esc(a.doc_type || "")}</td>
        <td>${esc(a.owner_code || "")} · ${esc(a.owner_name || "")}</td>
        <td>${esc(a.source_warehouse_code || "-")}</td>
        <td>${esc(a.supplier_name || "-")}</td>
        <td>${a.total_qty ?? 0}</td>
        <td>${a.category_count ?? 0}</td>
        <td>${asnStatusTag(a.status)}</td>
        <td class="muted">${esc(a.created_at)}</td>
        <td>
          <button class="btn secondary sm" onclick="openAsnDetail(${a.id})">明细</button>
          ${a.status === "open" ? `<button class="btn danger sm" onclick="cancelAsn(${a.id})">取消</button>` : ""}
        </td>
      </tr>`).join("");
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function asnStatusTag(s) {
  const map = { open: "待收货", receiving: "收货中", putaway: "上架中", closed: "已完成", cancelled: "已取消" };
  const cls = s === "closed" ? "ok" : "off";
  return `<span class="tag ${cls}">${map[s] || s}</span>`;
}

async function showDetail(id) {
  const data = await api("GET", "/api/asns/" + id);
  currentAsn = data;
  document.getElementById("detailCard").style.display = "";
  document.getElementById("detailTitle").textContent =
    `收货单明细：${data.asn.code}（${data.asn.status}）`;
  const a = data.asn;
  document.getElementById("asnMeta").innerHTML = [
    ["单据类型", a.doc_type || "-", "外部单号", a.external_no || "-"],
    ["来源仓库", a.source_warehouse_name || (a.source_warehouse_code || "-"), "订单来源", a.order_source || "-"],
    ["供应商", a.supplier_name || "-", "客户", a.customer_name || "-"],
    ["供应商联系人", a.supplier_contact || "-", "供应商电话", a.supplier_phone || "-"],
    ["供应商地址", a.supplier_address || "-", "客户联系人", a.customer_contact || "-"],
    ["客户电话", a.customer_phone || "-", "客户地址", a.customer_address || "-"],
    ["承运商", a.carrier_name || "-", "订单总数量", a.total_qty ?? 0],
    ["品类数", a.category_count ?? 0, "自定义1", a.extra1 || "-"],
    ["自定义2", a.extra2 || "-", "自定义3", a.extra3 || "-"],
    ["备注", a.note || "-", "", ""],
  ].map(([k1, v1, k2, v2]) =>
    `<tr><td class="muted">${k1}</td><td>${esc(v1)}</td><td class="muted">${k2}</td><td>${esc(v2)}</td></tr>`
  ).join("");
  await loadLocs();
  renderLines();
}

function renderLines() {
  const d = currentAsn;
  const cell = (v) => esc(v === 0 || v ? v : "-");
  document.getElementById("lineBody").innerHTML = d.lines.map((l) =>
    `<tr>
      <td>${l.id}</td><td>${esc(l.product_name || l.sku || "")}</td>
      <td>${cell(l.spec)}</td><td>${cell(l.article_no)}</td>
      <td>${l.expected_qty}</td><td>${cell(l.unit)}</td>
      <td>${cell(l.mfg_enterprise)}</td><td>${cell(l.batch_no)}</td>
      <td>${cell(l.production_date)}</td><td>${cell(l.expiry_date)}</td>
      <td>${cell(l.reg_cert_no)}</td><td>${cell(l.registrant)}</td>
      <td>${cell(l.mfg_license)}</td>
      <td><b>${l.received_qty}</b></td><td>${l.putaway_qty}</td>
      <td>
        <input id="rq-${l.id}" type="number" min="0.01" step="0.01" placeholder="数量" style="width:80px">
        <button class="btn sm" onclick="doReceive(${l.id})">收货</button>
      </td>
      <td>
        <input id="pq-${l.id}" type="number" min="0.01" step="0.01" placeholder="数量" style="width:80px">
        <button class="btn secondary sm" onclick="doPutaway(${l.id})">上架</button>
      </td>
    </tr>`).join("");
}

async function doReceive(lineId) {
  const qty = parseFloat(document.getElementById("rq-" + lineId).value);
  const locationId = parseInt(document.getElementById("recvLocSel").value, 10);
  try {
    const r = await api("POST", `/api/asns/${currentAsn.asn.id}/receive`,
      { line_id: lineId, location_id: locationId, qty });
    showMsg(document.getElementById("msg"), `收货成功，单据状态：${r.status}`, "success");
    await showDetail(currentAsn.asn.id);
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "收货失败：" + e.message, "error");
  }
}

async function doPutaway(lineId) {
  const qty = parseFloat(document.getElementById("pq-" + lineId).value);
  const fromId = parseInt(document.getElementById("fromLocSel").value, 10);
  const toId = parseInt(document.getElementById("toLocSel").value, 10);
  try {
    const r = await api("POST", `/api/asns/${currentAsn.asn.id}/putaway`,
      { line_id: lineId, from_location_id: fromId, to_location_id: toId, qty });
    showMsg(document.getElementById("msg"), `上架成功，单据状态：${r.status}`, "success");
    await showDetail(currentAsn.asn.id);
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "上架失败：" + e.message, "error");
  }
}

async function cancelAsn(id) {
  if (!confirm("确认取消该收货单？（仅未收货可取消）")) return;
  try {
    await api("POST", `/api/asns/${id}/cancel`);
    showMsg(document.getElementById("msg"), "已取消", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "取消失败：" + e.message, "error");
  }
}

async function openCreate() {
  await loadOptions();
  const whDefault = warehouseOptions.length ? warehouseOptions[0].value : "";
  const fields = [
    { type: "section", label: "① 单据信息" },
    { name: "code", label: "单号（留空自动生成 ASN-日期-流水）", autocode: true, autocodePrefix: "ASN" },
    { name: "owner_id", label: "货主 *", type: "select", required: true,
      placeholder: "请选择货主", options: ownerOptions,
      help: "选择货主后，客户/供应商/商品会标记归属并排前；仍可任选，选错会即时报错" },
    { name: "doc_type", label: "单据类型", type: "select", default: "采购", options: [
      { value: "采购", label: "采购" }, { value: "调拨", label: "调拨" },
      { value: "销退", label: "销退" }, { value: "期初", label: "期初" },
      { value: "其他", label: "其他" },
    ] },
    { name: "external_no", label: "外部单号" },
    { name: "order_source", label: "订单来源" },
    { name: "source_warehouse", label: "来源仓库 *", type: "select", required: true,
      placeholder: "请选择仓库", default: whDefault, options: warehouseOptions,
      help: warehouseOptions.length ? "已默认选中第一个仓库，可更换" : "尚无仓库，请到「基础主数据 → 仓库」创建" },

    { type: "section", label: "② 往来单位（联系方式可在下单时修改）" },
    { name: "supplier_id", label: "供应商", type: "select", placeholder: "请选择供应商", options: allSupplierOptions },
    { name: "supplier_contact", label: "供应商联系人" },
    { name: "supplier_phone", label: "供应商电话" },
    { name: "supplier_address", label: "供应商地址" },
    { name: "customer_id", label: "客户", type: "select", placeholder: "请选择客户", options: allCustomerOptions },
    { name: "customer_name", label: "客户名称（可覆盖）" },
    { name: "customer_contact", label: "客户联系人" },
    { name: "customer_phone", label: "客户电话" },
    { name: "customer_address", label: "客户地址" },
    { name: "carrier_name", label: "承运商" },

    { type: "section", label: "③ 收货明细（选择商品自动带出档案，批号/效期可补录）" },
    {
      name: "lines", label: "收货明细", type: "lines", full: true, cardLayout: true,
      lineFields: [
        { name: "product_id", label: "商品 *", type: "select", placeholder: "选择商品",
          required: true, options: productOptions, optionData: productData() },
        { name: "expected_qty", label: "数量 *", type: "number", required: true },
        ...SNAP_FIELDS, ...BATCH_FIELDS,
      ],
      autoFill: { product_id: {
        product_name: "name", spec: "spec", article_no: "article_no", unit: "unit",
        brand: "brand", mfg_enterprise: "mfg_enterprise", reg_cert_no: "reg_cert_no",
        registrant: "registrant", mfg_license: "mfg_license", shelf_life_days: "shelf_life_days",
      } },
      onLineChange: () => {
        if (modalEl) validateLinesOwner(modalEl, modalEl.querySelector('[name="owner_id"]').value);
      },
      onLineAdd: (row) => {
        if (!modalEl) return;
        const oid = modalEl.querySelector('[name="owner_id"]').value;
        reorderScoped(row.querySelector('[name="product_id"]'), productOptions, oid);
        validateLinesOwner(modalEl, oid);
      },
    },

    { type: "section", label: "④ 其他" },
    { name: "extra1", label: "自定义字段1" },
    { name: "extra2", label: "自定义字段2" },
    { name: "extra3", label: "自定义字段3" },
    { name: "note", label: "备注", type: "textarea", full: true },
  ];

  modalEl = openForm({
    title: "新建收货单（ASN）", submitText: "创建", width: 1000, fields,
    onSubmit: async (p) => {
      await api("POST", "/api/asns", p);
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
  bindLinkage(modalEl);
}

function openAsnDetail(id) {
  const r = asnList.find((x) => x.id === id);
  openDetail("收货 " + (r ? r.code : id), "/asns.html?detail=" + id);
}

loadOptions().then(load).then(() => {
  const dp = new URLSearchParams(location.search).get("detail");
  if (dp) showDetail(parseInt(dp, 10));
});
</script>
</body>
</html>
