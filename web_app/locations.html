<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>库位管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="brand" href="/">MiniWMS</a>
  <a class="link" href="/owners.html">货主</a>
  <a class="link" href="/products.html">物料</a>
  <a class="link" href="/locations.html">库位</a>
</nav>

<div class="container">
  <div id="msg" class="msg"></div>

  <div class="card">
    <h2>新建库位</h2>
    <form id="createForm" class="grid-form">
      <div><label>编码 *（如 A-01-01）</label><input name="code" required maxlength="32"></div>
      <div><label>名称 *</label><input name="name" required maxlength="128"></div>
      <div><label>库区</label><input name="zone" placeholder="默认: 默认区"></div>
      <div><label>类型</label>
        <select name="loc_type">
          <option value="storage">存储区</option>
          <option value="receiving">收货区</option>
          <option value="picking">拣货区</option>
          <option value="returns">退货区</option>
        </select>
      </div>
      <div><label>容量（0=不限）</label><input name="capacity" type="number" step="0.01" min="0" value="0"></div>
      <div style="align-self:end"><button class="btn" type="submit">创建</button></div>
    </form>
  </div>

  <div class="card">
    <h2>库位列表</h2>
    <div class="toolbar">
      <input id="kw" placeholder="编码/名称搜索">
      <select id="typeFilter">
        <option value="">全部类型</option>
        <option value="receiving">收货区</option>
        <option value="storage">存储区</option>
        <option value="picking">拣货区</option>
        <option value="returns">退货区</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
    <table>
      <thead><tr><th>ID</th><th>编码</th><th>名称</th><th>库区</th><th>类型</th><th>容量</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pager">
      <button class="btn secondary" id="prevBtn" onclick="turn(-1)">上一页</button>
      <span id="pageInfo"></span>
      <button class="btn secondary" id="nextBtn" onclick="turn(1)">下一页</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
let page = 1, pageSize = 20;

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const lt = document.getElementById("typeFilter").value;
  const qs = new URLSearchParams({ page, page_size: pageSize });
  if (kw) qs.set("keyword", kw);
  if (lt) qs.set("loc_type", lt);
  try {
    const data = await api("GET", "/api/locations?" + qs);
    const tb = document.getElementById("tbody");
    tb.innerHTML = data.locations.map((l) =>
      `<tr>
        <td>${l.id}</td><td>${esc(l.code)}</td><td>${esc(l.name)}</td>
        <td>${esc(l.zone)}</td><td>${esc(l.loc_type_label)}</td>
        <td>${l.capacity === 0 ? "不限" : l.capacity}</td>
        <td>${statusTag(l.status)}</td>
        <td>
          <button class="btn secondary" onclick="toggle(${l.id},'${l.status}')">${l.status === "active" ? "停用" : "启用"}</button>
          <button class="btn danger" onclick="del(${l.id})">删除</button>
        </td>
      </tr>`).join("");
    document.getElementById("pageInfo").textContent =
      `第 ${data.page} 页 / 共 ${data.total} 条`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page * pageSize >= data.total;
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function turn(d) { page += d; load(); }

document.getElementById("createForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const payload = Object.fromEntries(new FormData(ev.target).entries());
  try {
    await api("POST", "/api/locations", payload);
    showMsg(document.getElementById("msg"), "创建成功", "success");
    ev.target.reset();
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "创建失败：" + e.message, "error");
  }
});

async function toggle(id, status) {
  try {
    await api("PUT", "/api/locations/" + id, { status: status === "active" ? "inactive" : "active" });
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "操作失败：" + e.message, "error");
  }
}

async function del(id) {
  if (!confirm("确认删除该库位？（已有库存时会被拒绝）")) return;
  try {
    await api("DELETE", "/api/locations/" + id);
    showMsg(document.getElementById("msg"), "已删除", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "删除失败：" + e.message, "error");
  }
}

load();
</script>
</body>
</html>
