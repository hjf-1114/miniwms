<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>库位管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>库位管理</h1><div class="crumb">MiniWMS / 基础主数据</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>库位列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建库位</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="编码/名称搜索">
      <select id="typeFilter">
        <option value="">全部类型</option>
        <option value="receiving">收货区</option>
        <option value="storage">存储区</option>
        <option value="picking">拣货区</option>
        <option value="returns">退货区</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
    <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>编码</th><th>名称</th><th>库区</th><th>巷道</th><th>层</th><th>类型</th><th>容量</th><th>条码</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
    <div class="pager">
      <button class="btn secondary" id="prevBtn" onclick="turn(-1)">上一页</button>
      <span id="pageInfo"></span>
      <button class="btn secondary" id="nextBtn" onclick="turn(1)">下一页</button>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/layout.js"></script>
<script>
let page = 1, pageSize = 20;

const FIELDS = [
  { name: "code", label: "编码 *", required: true, autocode: true, autocodePrefix: "LOC" },
  { name: "name", label: "名称 *", required: true },
  { name: "zone", label: "库区", placeholder: "默认: 默认区" },
  { name: "aisle", label: "巷道", placeholder: "如 A" },
  { name: "bay", label: "列", placeholder: "如 01" },
  { name: "level", label: "层", placeholder: "如 01" },
  { name: "barcode", label: "库位条码" },
  { name: "loc_type", label: "类型", type: "select", options: [
    { value: "storage", label: "存储区" },
    { value: "receiving", label: "收货区" },
    { value: "picking", label: "拣货区" },
    { value: "returns", label: "退货区" },
  ] },
  { name: "capacity", label: "容量（0=不限）", type: "number" },
];

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const lt = document.getElementById("typeFilter").value;
  const qs = new URLSearchParams({ page, page_size: pageSize });
  if (kw) qs.set("keyword", kw);
  if (lt) qs.set("loc_type", lt);
  try {
    const data = await api("GET", "/api/locations?" + qs);
    document.getElementById("tbody").innerHTML = data.locations.map((l) =>
      `<tr>
        <td>${l.id}</td><td>${esc(l.code)}</td><td>${esc(l.name)}</td>
        <td>${esc(l.zone)}</td><td>${esc(l.aisle)}</td><td>${esc(l.level)}</td>
        <td>${esc(l.loc_type_label)}</td>
        <td>${l.capacity === 0 ? "不限" : l.capacity}</td><td>${esc(l.barcode)}</td>
        <td>${statusTag(l.status)}</td>
        <td>
          <button class="btn secondary sm" onclick="openEdit(${l.id})">编辑</button>
          <button class="btn secondary sm" onclick="toggle(${l.id},'${l.status}')">${l.status === "active" ? "停用" : "启用"}</button>
          <button class="btn danger sm" onclick="del(${l.id})">删除</button>
        </td>
      </tr>`).join("");
    document.getElementById("pageInfo").textContent =
      `第 ${data.page} 页 / 共 ${data.total} 条`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page * pageSize >= data.total;
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function turn(d) { page += d; load(); }

function openCreate() {
  openForm({
    title: "新建库位", submitText: "创建", fields: FIELDS,
    onSubmit: async (p) => {
      await api("POST", "/api/locations", p);
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
}

async function openEdit(id) {
  const data = await api("GET", "/api/locations/" + id);
  openForm({
    title: "编辑库位", submitText: "保存", fields: FIELDS, values: data.location,
    onSubmit: async (p) => {
      await api("PUT", "/api/locations/" + id, p);
      showMsg(document.getElementById("msg"), "已保存", "success");
      load();
    },
  });
}

async function toggle(id, status) {
  try {
    await api("PUT", "/api/locations/" + id, { status: status === "active" ? "inactive" : "active" });
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "操作失败：" + e.message, "error");
  }
}

async function del(id) {
  if (!confirm("确认删除该库位？（已有库存时会被拒绝）")) return;
  try {
    await api("DELETE", "/api/locations/" + id);
    showMsg(document.getElementById("msg"), "已删除", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "删除失败：" + e.message, "error");
  }
}

load();
</script>
</body>
</html>
