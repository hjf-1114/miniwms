<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上架作业 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>上架作业</h1><div class="crumb">MiniWMS / 出入库作业 / 上架与货位推荐</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>

      <div class="card">
        <div class="card-head">
          <h2 id="asnTitle">收货单</h2>
          <div class="flex">
            <button class="btn secondary" onclick="openWorkTab('验收作业 · ' + (asnCode || ''), '/asn_receive.html?asn_id=' + asnId)">← 前往验收作业</button>
            <button class="btn secondary" onclick="openWorkTab('收货管理', '/asns.html?detail=' + asnId)">返回收货单</button>
            <button class="btn secondary" onclick="loadAll()">刷新</button>
          </div>
        </div>
        <div class="toolbar">
          <label class="muted text-sm">收货单</label>
          <select id="asnSel" style="min-width:240px"><option value="">加载中…</option></select>
        </div>
        <div class="table-wrap"><table><tbody id="asnMeta"></tbody></table></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>上架录入</h2></div>
        <div class="text-sm muted" style="margin:0 0 10px">
          目标货位可手工选，也可在下方「推荐货位」一键采纳。推荐只是只读建议，最终过账仍走原有上架接口。
        </div>
        <div class="toolbar">
          <label class="muted text-sm">明细行</label>
          <select id="lineSel" style="min-width:280px"><option value="">请选择明细行</option></select>
          <label class="muted text-sm">来源暂存位</label>
          <select id="fromLocSel" style="min-width:190px"><option value="">请选择暂存位</option></select>
          <label class="muted text-sm">本次上架数量</label>
          <input id="putQty" type="number" min="0.01" step="0.01" style="width:110px" placeholder="数量">
          <label class="muted text-sm">目标货位</label>
          <select id="toLocSel" style="min-width:230px"><option value="">请选择目标货位</option></select>
          <button class="btn" id="putBtn" onclick="doPutaway()">确认上架</button>
        </div>
        <div id="lineHint" class="text-sm muted"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>推荐货位</h2>
          <div class="flex">
            <span id="engineHint" class="text-sm muted"></span>
            <button class="btn secondary sm" onclick="loadRecommend()">重新计算推荐</button>
          </div>
        </div>
        <div id="recSummary" class="text-sm muted" style="margin:0 0 10px">选择明细行后自动计算。</div>
        <div class="toolbar">
          <label class="muted text-sm">改位 / 驳回原因码</label>
          <select id="overrideReasonSel" style="min-width:170px"><option value="">请选择…</option></select>
          <input id="overrideReasonText" placeholder="或手工填写原因（选「其他」时必填）" style="min-width:230px">
          <button class="btn secondary sm" onclick="rejectRecommend()">驳回本次推荐</button>
          <span class="text-sm muted">人工选了非推荐货位时，上架前必须留原因码</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>货位</th><th>仓库 / 储区</th><th>分数</th><th>推荐理由</th><th>已用 / 容量</th><th>操作</th></tr></thead>
            <tbody id="recBody"></tbody>
          </table>
        </div>
        <details style="margin-top:10px">
          <summary class="text-sm muted" id="rejSummary">被排除的货位（0）</summary>
          <div class="table-wrap" style="margin-top:8px"><table>
            <thead><tr><th>货位</th><th>排除原因</th></tr></thead>
            <tbody id="rejBody"></tbody>
          </table></div>
        </details>
      </div>

      <div class="card">
        <div class="card-head"><h2>明细与上架进度</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>行</th><th>货品</th><th>规格</th><th>应收</th><th>已收</th><th>已上架</th><th>批号</th><th>操作</th></tr></thead>
            <tbody id="lineBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
const params = new URLSearchParams(location.search);
let asnId = params.get("asn_id") || "";
const presetLine = params.get("line_id") || "";
let asnCode = "", asnData = null, recvLocs = [], destLocs = [], lastRec = null;
let recTimer = null, adoptedLoc = null, overrideReasons = [];

/** 改位 / 驳回原因码：下拉值与手工文本二选一，「其他」必须补文本。 */
function getOverrideReason() {
  const sel = document.getElementById("overrideReasonSel").value;
  const text = document.getElementById("overrideReasonText").value.trim();
  if (sel === "其他") return text;
  return sel || text;
}

async function loadOverrideReasons() {
  try {
    const d = await api("GET", "/api/external-doc-types");
    overrideReasons = d.override_reasons || [];
    document.getElementById("overrideReasonSel").innerHTML =
      '<option value="">请选择…</option>' +
      overrideReasons.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  } catch (e) {
    document.getElementById("overrideReasonSel").innerHTML =
      '<option value="">字典不可用，请手工填写</option>';
  }
}

/** 登记一次推荐日志动作；简版引擎（无日志 id）只提示、不阻断作业。 */
async function logAction(action, payload) {
  if (!lastRec || !lastRec.recommendation_id) return false;
  await api("POST", `/api/putaway-recommendations/${lastRec.recommendation_id}/action`,
    Object.assign({ action, operator: "web" }, payload));
  return true;
}

function asnStatusTag(s) {
  const map = { open: "待收货", receiving: "收货中", putaway: "上架中", closed: "已完成", cancelled: "已取消" };
  return `<span class="tag ${s === "closed" ? "ok" : "off"}">${map[s] || s}</span>`;
}

async function loadAsnOptions() {
  const d = await api("GET", "/api/asns?page_size=100");
  const sel = document.getElementById("asnSel");
  sel.innerHTML = '<option value="">请选择收货单…</option>' +
    d.asns.map(a => `<option value="${a.id}">${esc(a.code)} · ${esc(a.owner_name || "")}（${esc(a.status)}）</option>`).join("");
  if (!asnId && d.asns.length) asnId = String(d.asns[0].id);
  sel.value = asnId;
  sel.addEventListener("change", () => {
    asnId = sel.value;
    if (asnId) loadAll(); else { asnData = null; renderMeta(); renderLines(); }
  });
}

async function loadLocs() {
  const [recv, dest] = await Promise.all([
    api("GET", "/api/locations?loc_type=receiving&status=active&page_size=100"),
    api("GET", "/api/locations?status=active&page_size=100"),
  ]);
  recvLocs = recv.locations;
  destLocs = dest.locations.filter(l => l.loc_type === "storage" || l.loc_type === "picking");
  const f = document.getElementById("fromLocSel");
  const fc = f.value;
  f.innerHTML = '<option value="">请选择暂存位</option>' +
    recvLocs.map(l => `<option value="${l.id}">${esc(l.code)} · ${esc(l.name)}</option>`).join("");
  f.value = fc || (recvLocs.length ? String(recvLocs[0].id) : "");
  const t = document.getElementById("toLocSel");
  const tc = t.value;
  t.innerHTML = '<option value="">请选择目标货位</option>' +
    destLocs.map(l => `<option value="${l.id}">${esc(l.code)} · ${esc(l.name)}〔${esc(l.zone_name || "无储区")}｜${esc(l.warehouse_name || "未指定仓库")}〕</option>`).join("");
  t.value = tc;
}

function renderMeta() {
  const a = asnData ? asnData.asn : null;
  asnCode = a ? a.code : "";
  document.getElementById("asnTitle").textContent = a ? `上架作业：${a.code}` : "上架作业（未选择收货单）";
  document.getElementById("asnMeta").innerHTML = a ? [
    ["单据状态", asnStatusTag(a.status), "货主", `${esc(a.owner_code || "")} ${esc(a.owner_name || "")}`],
    ["单据类型", a.doc_type || "-", "来源仓库", a.source_warehouse_name || a.source_warehouse_code || "-"],
    ["供应商", a.supplier_name || "-", "外部单号", a.external_no || "-"],
    ["创建时间", a.created_at || "-", "备注", a.note || "-"],
  ].map(([k1, v1, k2, v2]) =>
    `<tr><td class="muted">${k1}</td><td>${v1}</td><td class="muted">${k2}</td><td>${v2}</td></tr>`
  ).join("") : '<tr><td class="muted">请在上方选择一张收货单</td></tr>';
}

function lineLabel(l) {
  return `#${l.id} ${l.product_name || l.sku || "货品"} · 已收 ${l.received_qty} / 已上架 ${l.putaway_qty}${l.unit || ""}`;
}

function renderLines() {
  const lines = asnData ? asnData.lines : [];
  const sel = document.getElementById("lineSel");
  const cur = sel.value || presetLine;
  sel.innerHTML = '<option value="">请选择明细行</option>' +
    lines.map(l => `<option value="${l.id}">${esc(lineLabel(l))}</option>`).join("");
  sel.value = cur || (lines.length ? String(lines[0].id) : "");
  document.getElementById("lineBody").innerHTML = lines.map(l =>
    `<tr>
      <td>${l.id}</td><td>${esc(l.product_name || l.sku || "")}</td><td>${esc(l.spec || "-")}</td>
      <td>${l.expected_qty}</td><td>${l.received_qty}</td><td><b>${l.putaway_qty}</b></td>
      <td>${esc(l.batch_no || "-")}</td>
      <td><button class="btn secondary sm" onclick="pickLine(${l.id})">选为当前行</button></td>
    </tr>`
  ).join("") || '<tr><td colspan="8" class="muted">该收货单暂无明细行</td></tr>';
  updateHint();
}

function updateHint() {
  const id = document.getElementById("lineSel").value;
  const l = (asnData ? asnData.lines : []).find(x => String(x.id) === String(id));
  const box = document.getElementById("lineHint");
  if (!l) { box.textContent = ""; return; }
  const left = Number(l.received_qty) - Number(l.putaway_qty);
  box.textContent = `当前行：${l.product_name || l.sku || ""}｜暂存位可上架 ${Math.max(0, left)}${l.unit || ""}｜批号 ${l.batch_no || "（明细未填）"}`;
  if (!document.getElementById("putQty").value && left > 0) {
    document.getElementById("putQty").value = left;
  }
}

function pickLine(id) {
  document.getElementById("lineSel").value = String(id);
  document.getElementById("putQty").value = "";
  updateHint();
  loadRecommend();
}

async function loadRecommend() {
  const body = document.getElementById("recBody");
  const rej = document.getElementById("rejBody");
  const sum = document.getElementById("recSummary");
  const lineId = document.getElementById("lineSel").value;
  if (!asnId || !lineId) {
    lastRec = null; adoptedLoc = null; body.innerHTML = ""; rej.innerHTML = "";
    sum.textContent = "请选择收货单与明细行后自动计算。";
    document.getElementById("engineHint").textContent = "";
    document.getElementById("rejSummary").textContent = "被排除的货位（0）";
    return;
  }
  const qty = parseFloat(document.getElementById("putQty").value) || 0;
  const qs = new URLSearchParams({ asn_id: asnId, line_id: lineId, qty: String(qty), top_n: "8" });
  try {
    const d = await api("GET", "/api/putaway/recommend?" + qs);
    lastRec = d;
    adoptedLoc = null;
    sum.textContent = `${d.sku} ${d.product_name}｜批号 ${d.batch_no || "—"}｜候选 ${d.candidate_count} 个，通过 ${d.recommendations.length ? "（已取前 " + d.recommendations.length + "）" : "0 个"}｜绑定货位 ${d.bound_location_count} 个｜推荐储区 ${d.default_zone_id ? "#" + d.default_zone_id : "未设置"}`;
    // M25 可解释字段在 M26 落到页面上，方便按「策略包 / 规则 / 日志 id」排查
    const trace = [`引擎 ${d.engine || "—"}`];
    if (d.rule_set) trace.push(`策略包 ${d.rule_set}`);
    if (d.hit_rule) trace.push(`命中规则 ${d.hit_rule}`);
    if (d.hit_priority !== undefined && d.hit_priority !== null) trace.push(`优先级 ${d.hit_priority}`);
    if (d.hit_step !== undefined && d.hit_step !== null) trace.push(`步骤 ${d.hit_step}`);
    if (d.recommendation_id) trace.push(`日志 #${d.recommendation_id}`);
    document.getElementById("engineHint").textContent = trace.join(" · ");
    body.innerHTML = d.recommendations.map((r, i) =>
      `<tr>
        <td>${i + 1}</td>
        <td><b>${esc(r.code)}</b> · ${esc(r.name)}</td>
        <td>${esc(r.warehouse_code || "—")} / ${esc(r.zone_name || "无储区")}</td>
        <td><b>${r.score}</b></td>
        <td>${(r.reason_labels || []).map(x => `<span class="tag ok">${esc(x)}</span>`).join(" ")}</td>
        <td>${r.used_qty} / ${r.capacity === 0 ? "不限" : r.capacity}</td>
        <td><button class="btn sm" onclick="adopt(${r.location_id})">一键采纳</button></td>
      </tr>`
    ).join("") || '<tr><td colspan="7" class="muted">没有可用货位，请查看下方被排除原因，或调整储区/混放/容量设置</td></tr>';
    rej.innerHTML = d.rejected.map(r =>
      `<tr><td>${esc(r.code)} · ${esc(r.name)}</td><td>${esc(r.reason)}</td></tr>`
    ).join("") || '<tr><td colspan="2" class="muted">无</td></tr>';
    document.getElementById("rejSummary").textContent = `被排除的货位（${d.rejected.length}）`;
  } catch (e) {
    lastRec = null; adoptedLoc = null;
    document.getElementById("engineHint").textContent = "";
    body.innerHTML = `<tr><td colspan="7" class="muted">推荐计算失败：${esc(e.message)}</td></tr>`;
    sum.textContent = "推荐计算失败。";
  }
}

/** 采纳 = 填目标货位 + 写推荐日志；不写库存，过账仍由「确认上架」触发。 */
async function adopt(locationId) {
  const sel = document.getElementById("toLocSel");
  const msgEl = document.getElementById("msg");
  sel.value = String(locationId);
  adoptedLoc = Number(locationId);
  try {
    const logged = await logAction("adopt", { chosen_location_id: Number(locationId) });
    showMsg(msgEl, logged
      ? `已采纳货位 #${locationId}（推荐日志已留痕），请确认数量后点「确认上架」`
      : `已采纳货位 #${locationId}（简版引擎无推荐日志），请确认数量后点「确认上架」`, "success");
  } catch (e) {
    showMsg(msgEl, `已采纳货位 #${locationId}，但推荐日志留痕失败：${e.message}`, "error");
  }
  sel.focus();
}

/** 驳回本次推荐：原因码必填，只写日志、不改库存、不影响后续人工上架。 */
async function rejectRecommend() {
  const msgEl = document.getElementById("msg");
  const reason = getOverrideReason();
  if (!reason) { showMsg(msgEl, "驳回推荐必须选择或填写原因码", "error"); return; }
  if (!lastRec || !lastRec.recommendation_id) {
    showMsg(msgEl, "简版引擎没有推荐日志，无法登记驳回动作", "error"); return;
  }
  try {
    await logAction("reject", { override_reason: reason });
    showMsg(msgEl, `已驳回本次推荐并留痕（原因：${reason}）`, "success");
  } catch (e) {
    showMsg(msgEl, "驳回留痕失败：" + e.message, "error");
  }
}

async function doPutaway() {
  const msg = document.getElementById("msg");
  if (!asnId) { showMsg(msg, "请先选择收货单", "error"); return; }
  const lineId = document.getElementById("lineSel").value;
  const fromId = document.getElementById("fromLocSel").value;
  const toId = document.getElementById("toLocSel").value;
  const qty = parseFloat(document.getElementById("putQty").value);
  if (!lineId || !fromId || !toId || !(qty > 0)) {
    showMsg(msg, "明细行 / 来源暂存位 / 目标货位 / 数量均必填，数量须大于 0", "error");
    return;
  }
  // 设计 §14 阶段 F「改位必填原因码」：有推荐候选却选了非采纳货位，
  // 先写一条 reject 日志留痕再过账；后端过账接口本身保持 M25 原样，不受影响。
  const hasRec = lastRec && lastRec.recommendations && lastRec.recommendations.length;
  if (hasRec && adoptedLoc !== Number(toId)) {
    const reason = getOverrideReason();
    if (!reason) {
      showMsg(msg, "目标货位与已采纳的推荐货位不一致：请先在「改位 / 驳回原因码」选择或填写原因", "error");
      return;
    }
    try {
      await logAction("reject", { override_reason: reason });
    } catch (e) {
      showMsg(msg, "改位留痕失败，已阻止上架：" + e.message, "error");
      return;
    }
  }
  try {
    const r = await api("POST", `/api/asns/${asnId}/putaway`, {
      line_id: Number(lineId), from_location_id: Number(fromId),
      to_location_id: Number(toId), qty,
    });
    showMsg(msg, `上架成功，单据状态：${r.status}`, "success");
    document.getElementById("putQty").value = "";
    document.getElementById("toLocSel").value = "";
    await loadAll();
  } catch (e) {
    showMsg(msg, "上架失败：" + e.message, "error");
  }
}

async function loadAll() {
  try {
    await loadLocs();
    if (!asnId) { asnData = null; renderMeta(); renderLines(); await loadRecommend(); return; }
    asnData = await api("GET", "/api/asns/" + asnId);
    document.getElementById("asnSel").value = String(asnId);
    renderMeta();
    renderLines();
    await loadRecommend();
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

document.getElementById("lineSel").addEventListener("change", () => {
  document.getElementById("putQty").value = "";
  updateHint();
  loadRecommend();
});
document.getElementById("putQty").addEventListener("input", () => {
  clearTimeout(recTimer);
  recTimer = setTimeout(loadRecommend, 350);
});
loadOverrideReasons();
loadAsnOptions().then(loadAll);
</script>
</body>
</html>
