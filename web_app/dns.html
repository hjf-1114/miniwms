<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出库管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>出库作业</h1><div class="crumb">MiniWMS / 出入库作业</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>出库单列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建出库单</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="单号搜索">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="open">待拣货</option>
        <option value="picking">拣货中</option>
        <option value="shipped">已发货</option>
        <option value="cancelled">已取消</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
      <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>单号</th><th>单据类型</th><th>货主</th><th>客户</th><th>来源仓库</th><th>总数量</th><th>品类数</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <h2 id="detailTitle">出库单明细</h2>
    <div class="table-wrap">
      <table>
      <tbody id="dnMeta"></tbody>
    </table>
    </div>
    <div class="toolbar">
      <select id="pickLocSel"></select><span class="muted">← 拣货来源位（存储/拣货区）</span>
      <button class="btn secondary" onclick="loadLocs()">刷新库位</button>
      <button class="btn" onclick="doShip()">发货（要求全部拣满）</button>
    </div>
    <div class="table-wrap">
      <table>
      <thead><tr><th>行</th><th>SKU</th><th>物料</th><th>订购</th><th>已拣</th><th>待拣</th><th>拣货</th></tr></thead>
      <tbody id="lineBody"></tbody>
    </table>
    </div>
    <h3 style="margin-top:14px">拣货明细</h3>
    <div class="table-wrap">
      <table>
      <thead><tr><th>明细</th><th>行</th><th>库位</th><th>数量</th></tr></thead>
      <tbody id="pickBody"></tbody>
    </table>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/layout.js"></script>
<script>
let currentDn = null;
let ownerOptions = [];
let productOptions = [];
let allCustomerOptions = [];
let warehouseOptions = [];
let dnList = [];

async function loadOptions() {
  const [ow, pr, cu, wh] = await Promise.all([
    api("GET", "/api/owners?page_size=100"),
    api("GET", "/api/products?page_size=100"),
    api("GET", "/api/customers?page_size=100"),
    api("GET", "/api/warehouses?page_size=100"),
  ]);
  ownerOptions = ow.owners.map((o) => ({ value: o.id, label: `${o.code} · ${o.name}` }));
  productOptions = pr.products.map((p) => ({ value: p.id, label: `${p.sku} · ${p.name}` }));
  allCustomerOptions = cu.customers.map((c) => ({
    value: c.id, label: `${c.code} · ${c.name}`, owner_id: c.owner_id,
  }));
  warehouseOptions = wh.warehouses.map((w) => ({ value: w.id, label: `${w.code} · ${w.name}` }));
}

function customersForOwner(ownerId) {
  if (!ownerId) return allCustomerOptions;
  return allCustomerOptions.filter((c) => String(c.owner_id) === String(ownerId));
}

async function loadLocs() {
  const data = await api("GET", "/api/locations?status=active&page_size=100");
  const opts = data.locations.filter(
    (l) => l.loc_type === "storage" || l.loc_type === "picking").map(
    (l) => `<option value="${l.id}">${esc(l.code)}（${esc(l.loc_type_label)}）</option>`).join("");
  document.getElementById("pickLocSel").innerHTML = opts;
}

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const st = document.getElementById("statusFilter").value;
  const qs = new URLSearchParams({ page_size: 50 });
  if (kw) qs.set("keyword", kw);
  if (st) qs.set("status", st);
  try {
    const data = await api("GET", "/api/dns?" + qs);
    dnList = data.dns;
    document.getElementById("tbody").innerHTML = data.dns.map((d) =>
      `<tr>
        <td>${d.id}</td><td>${esc(d.code)}</td>
        <td>${esc(d.doc_type || "")}</td>
        <td>${esc(d.owner_code || "")} · ${esc(d.owner_name || "")}</td>
        <td>${esc(d.customer_code || "-")} · ${esc(d.customer_name || "-")}</td>
        <td>${esc(d.source_warehouse_code || "-")}</td>
        <td>${d.total_qty ?? 0}</td>
        <td>${d.category_count ?? 0}</td>
        <td>${dnStatusTag(d.status)}</td>
        <td class="muted">${esc(d.created_at)}</td>
        <td>
          <button class="btn secondary sm" onclick="openDnDetail(${d.id})">明细</button>
          ${d.status === "open" ? `<button class="btn danger sm" onclick="cancelDn(${d.id})">取消</button>` : ""}
        </td>
      </tr>`).join("");
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function dnStatusTag(s) {
  const map = { open: "待拣货", picking: "拣货中", shipped: "已发货", cancelled: "已取消" };
  const cls = s === "shipped" ? "ok" : "off";
  return `<span class="tag ${cls}">${map[s] || s}</span>`;
}

async function showDetail(id) {
  const data = await api("GET", "/api/dns/" + id);
  currentDn = data;
  document.getElementById("detailCard").style.display = "";
  document.getElementById("detailTitle").textContent =
    `出库单明细：${data.dn.code}（${data.dn.status}） → 客户 ${data.dn.customer_code || "-"} · ${data.dn.customer_name || "-"}`;
  const d = data.dn;
  document.getElementById("dnMeta").innerHTML = [
    ["单据类型", d.doc_type || "-", "外部单号", d.external_no || "-"],
    ["来源仓库", d.source_warehouse_name || (d.source_warehouse_code || "-"), "订单来源", d.order_source || "-"],
    ["承运商", d.carrier_name || "-", "订单总数量", d.total_qty ?? 0],
    ["品类数", d.category_count ?? 0, "自定义1", d.extra1 || "-"],
    ["自定义2", d.extra2 || "-", "自定义3", d.extra3 || "-"],
    ["备注", d.note || "-", "", ""],
  ].map(([k1, v1, k2, v2]) =>
    `<tr><td class="muted">${k1}</td><td>${esc(v1)}</td><td class="muted">${k2}</td><td>${esc(v2)}</td></tr>`
  ).join("");
  await loadLocs();
  renderLines();
}

function renderLines() {
  const d = currentDn;
  document.getElementById("lineBody").innerHTML = d.lines.map((l) =>
    `<tr>
      <td>${l.id}</td><td>${esc(l.sku)}</td><td>${esc(l.product_name)}</td>
      <td>${l.ordered_qty}</td><td><b>${l.picked_qty}</b></td><td>${l.remaining_pick}</td>
      <td>
        <input id="pk-${l.id}" type="number" min="0.01" step="0.01" placeholder="数量" style="width:80px">
        <button class="btn sm" onclick="doPick(${l.id})" ${d.dn.status === "shipped" || d.dn.status === "cancelled" ? "disabled" : ""}>拣货</button>
      </td>
    </tr>`).join("");
  document.getElementById("pickBody").innerHTML = d.picks.length
    ? d.picks.map((p) =>
      `<tr><td>${p.id}</td><td>${p.line_id}</td><td>${esc(p.location_code)}</td><td>${p.qty}</td></tr>`).join("")
    : `<tr><td colspan="4" class="muted">暂无拣货明细</td></tr>`;
}

async function doPick(lineId) {
  const qty = parseFloat(document.getElementById("pk-" + lineId).value);
  const locationId = parseInt(document.getElementById("pickLocSel").value, 10);
  try {
    const r = await api("POST", `/api/dns/${currentDn.dn.id}/pick`,
      { line_id: lineId, location_id: locationId, qty });
    showMsg(document.getElementById("msg"), `拣货成功，单据状态：${r.status}`, "success");
    await showDetail(currentDn.dn.id);
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "拣货失败：" + e.message, "error");
  }
}

async function doShip() {
  if (!currentDn) return;
  if (!confirm("确认发货？将按拣货明细逐库位扣减库存。")) return;
  try {
    const r = await api("POST", `/api/dns/${currentDn.dn.id}/ship`);
    showMsg(document.getElementById("msg"), `发货成功，单据状态：${r.status}`, "success");
    await showDetail(currentDn.dn.id);
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "发货失败：" + e.message, "error");
  }
}

async function cancelDn(id) {
  if (!confirm("确认取消该出库单？（仅未拣货可取消）")) return;
  try {
    await api("POST", `/api/dns/${id}/cancel`);
    showMsg(document.getElementById("msg"), "已取消", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "取消失败：" + e.message, "error");
  }
}

async function openCreate() {
  await loadOptions();
  openForm({
    title: "新建出库单（DN）", submitText: "创建", width: 780,
    fields: [
      { name: "code", label: "单号 *（留空自动生成 DN-日期-流水）", required: false, autocode: true, autocodePrefix: "DN" },
      { name: "owner_id", label: "货主 *", type: "select", required: true, options: ownerOptions },
      { name: "customer_id", label: "客户 *", type: "select", required: true, options: allCustomerOptions },
      { name: "doc_type", label: "单据类型", type: "select", options: [
        { value: "销售", label: "销售" }, { value: "调拨", label: "调拨" },
        { value: "退货", label: "退货" }, { value: "其他", label: "其他" },
      ] },
      { name: "external_no", label: "外部单号（主单号）" },
      { name: "order_source", label: "订单来源" },
      { name: "source_warehouse", label: "来源仓库", type: "select", options: warehouseOptions },
      { name: "carrier_name", label: "承运商名称" },
      { name: "extra1", label: "自定义字段1" },
      { name: "extra2", label: "自定义字段2" },
      { name: "extra3", label: "自定义字段3" },
      { name: "note", label: "备注", type: "textarea", full: true },
      {
        name: "lines", label: "出库明细", type: "lines", full: true,
        lineFields: [
          { name: "product_id", label: "物料", type: "select", options: productOptions },
          { name: "ordered_qty", label: "订购数量", type: "number" },
        ],
      },
    ],
    onSubmit: async (p) => {
      await api("POST", "/api/dns", p);
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
  // 选择货主后联动过滤客户列表（多货主隔离）
  const ov = document.querySelector(".modal-overlay");
  if (ov) {
    const ownerSel = ov.querySelector('[name="owner_id"]');
    const custSel = ov.querySelector('[name="customer_id"]');
    if (ownerSel && custSel) {
      const sync = () => {
        const list = customersForOwner(ownerSel.value);
        const cur = custSel.value;
        custSel.innerHTML = list.map((c) =>
          `<option value="${esc(c.value)}" ${String(c.value) === String(cur) ? "selected" : ""}>${esc(c.label)}</option>`).join("");
      };
      sync();
      ownerSel.addEventListener("change", sync);
    }
  }
}

function openDnDetail(id) {
  const r = dnList.find((x) => x.id === id);
  openDetail("出库 " + (r ? r.code : id), "/dns.html?detail=" + id);
}

loadOptions().then(load).then(() => {
  const dp = new URLSearchParams(location.search).get("detail");
  if (dp) showDetail(parseInt(dp, 10));
});
</script>
</body>
</html>
