<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物料管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>物料管理</h1><div class="crumb">MiniWMS / 基础主数据</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>物料列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建物料</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="SKU/名称搜索">
      <select id="ownerFilter"><option value="">全部货主</option></select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
    <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>SKU</th><th>名称</th><th>条码</th><th>品牌</th><th>规格</th><th>分类</th><th>货主</th><th>采购价</th><th>销售价</th><th>当前库存</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
    <div class="pager">
      <button class="btn secondary" id="prevBtn" onclick="turn(-1)">上一页</button>
      <span id="pageInfo"></span>
      <button class="btn secondary" id="nextBtn" onclick="turn(1)">下一页</button>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/layout.js"></script>
<script>
let page = 1, pageSize = 20;
let ownerOptions = [{ value: "", label: "自营" }];

function productFields() {
  return [
    { name: "sku", label: "SKU *", required: true, autocode: true, autocodePrefix: "SKU" },
    { name: "name", label: "名称 *", required: true },
    { name: "category", label: "分类" },
    { name: "unit", label: "单位" },
    { name: "barcode", label: "条码" },
    { name: "brand", label: "品牌" },
    { name: "spec", label: "规格" },
    { name: "weight_kg", label: "重量(kg)", type: "number" },
    { name: "length_cm", label: "长(cm)", type: "number" },
    { name: "width_cm", label: "宽(cm)", type: "number" },
    { name: "height_cm", label: "高(cm)", type: "number" },
    { name: "shelf_life_days", label: "保质期(天)", type: "number" },
    { name: "purchase_price", label: "采购价", type: "number" },
    { name: "sale_price", label: "销售价", type: "number" },
    { name: "owner_id", label: "货主（可空=自营）", type: "select", nullable: true, options: ownerOptions },
    { name: "status", label: "状态", type: "select", options: [{ value: "active", label: "启用" }, { value: "inactive", label: "停用" }] },
    { name: "note", label: "备注", type: "textarea", full: true },
  ];
}

async function loadOwners() {
  const data = await api("GET", "/api/owners?page_size=100");
  ownerOptions = [{ value: "", label: "自营" }].concat(
    data.owners.map((o) => ({ value: o.id, label: `${o.code} · ${o.name}` }))
  );
  document.getElementById("ownerFilter").insertAdjacentHTML("beforeend",
    data.owners.map((o) => `<option value="${o.id}">${esc(o.code)} · ${esc(o.name)}</option>`).join(""));
}

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const oid = document.getElementById("ownerFilter").value;
  const qs = new URLSearchParams({ page, page_size: pageSize });
  if (kw) qs.set("keyword", kw);
  if (oid) qs.set("owner_id", oid);
  try {
    const data = await api("GET", "/api/products?" + qs);
    document.getElementById("tbody").innerHTML = data.products.map((p) =>
      `<tr>
        <td>${p.id}</td><td>${esc(p.sku)}</td><td>${esc(p.name)}</td>
        <td>${esc(p.barcode)}</td><td>${esc(p.brand)}</td><td>${esc(p.spec)}</td>
        <td>${esc(p.category)}</td>
        <td>${p.owner_code ? esc(p.owner_code + " · " + p.owner_name) : '<span class="muted">自营</span>'}</td>
        <td>${p.purchase_price}</td><td>${p.sale_price}</td>
        <td><b>${p.stock_qty}</b></td>
        <td>${statusTag(p.status)}</td>
        <td>
          <button class="btn secondary sm" onclick="openEdit(${p.id})">编辑</button>
          <button class="btn danger sm" onclick="del(${p.id})">删除</button>
        </td>
      </tr>`).join("");
    document.getElementById("pageInfo").textContent = `第 ${data.page} 页 / 共 ${data.total} 条`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page * pageSize >= data.total;
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function turn(d) { page += d; load(); }

function openCreate() {
  openForm({
    title: "新建物料", submitText: "创建", fields: productFields(),
    onSubmit: async (p) => {
      await api("POST", "/api/products", p);
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
}

async function openEdit(id) {
  const data = await api("GET", "/api/products/" + id);
  openForm({
    title: "编辑物料", submitText: "保存", fields: productFields(), values: data.product,
    onSubmit: async (p) => {
      await api("PUT", "/api/products/" + id, p);
      showMsg(document.getElementById("msg"), "已保存", "success");
      load();
    },
  });
}

async function del(id) {
  if (!confirm("确认删除该物料？（库存非 0 时会被拒绝）")) return;
  try {
    await api("DELETE", "/api/products/" + id);
    showMsg(document.getElementById("msg"), "已删除", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "删除失败：" + e.message, "error");
  }
}

loadOwners().then(load);
</script>
</body>
</html>
