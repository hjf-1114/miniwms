<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物料管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>物料管理</h1><div class="crumb">MiniWMS / 基础主数据</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>物料列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建物料</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="SKU/名称搜索">
      <select id="ownerFilter"><option value="">全部货主</option></select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
    <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>SKU</th><th>名称</th><th>条码</th><th>品牌</th><th>规格</th><th>分类</th><th>货主</th><th>采购价</th><th>销售价</th><th>当前库存</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
    <div class="pager">
      <button class="btn secondary" id="prevBtn" onclick="turn(-1)">上一页</button>
      <span id="pageInfo"></span>
      <button class="btn secondary" id="nextBtn" onclick="turn(1)">下一页</button>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/layout.js"></script>
<script>
let page = 1, pageSize = 20;
let ownerOptions = [{ value: "", label: "自营" }];

// 体积：未手填但填了长宽高时，前端先做 cm³ 估算（后端为权威口径，会再算一次）
function autoVolume(p) {
  if (p.volume === "" || p.volume === null || p.volume === undefined) {
    if (p.length_cm && p.width_cm && p.height_cm) {
      p.volume = Math.round(Number(p.length_cm) * Number(p.width_cm) * Number(p.height_cm) * 10000) / 10000;
    }
  }
  return p;
}

function productFields() {
  const yesno = [{ value: 0, label: "否" }, { value: 1, label: "是" }];
  return [
    { name: "sku", label: "SKU *", required: true, autocode: true, autocodePrefix: "SKU" },
    { name: "name", label: "名称 *", required: true },
    { name: "article_no", label: "货号" },
    { name: "category", label: "默认分类" },
    { name: "unit", label: "单位" },
    { name: "barcode", label: "主条码" },
    { name: "brand", label: "品牌" },
    { name: "spec", label: "规格型号" },
    { name: "product_type", label: "产品类型" },
    { name: "main_category", label: "产品主分类" },
    { name: "category_l1", label: "一级分类" },
    { name: "category_l2", label: "二级分类" },
    { name: "category_l3", label: "三级分类" },
    { name: "category_l4", label: "四级分类" },
    { name: "origin", label: "产地" },
    { name: "external_code", label: "外部编码" },
    { name: "business_scope", label: "经营范围", full: true },
    { name: "reg_cert_no", label: "注册证号" },
    { name: "registrant", label: "注册人/备案人" },
    { name: "mfg_enterprise", label: "生产企业" },
    { name: "mfg_license", label: "生产企业许可证" },
    { name: "temp_range", label: "温度范围" },
    { name: "humidity_range", label: "湿度范围" },
    { name: "hazard_type", label: "危险品类型" },
    { name: "is_serial", label: "是否序列号", type: "select", options: yesno },
    { name: "is_shelf_control", label: "是否保质期控制", type: "select", options: yesno },
    { name: "extra1", label: "备用字段1" },
    { name: "extra2", label: "备用字段2" },
    { name: "extra3", label: "备用字段3" },
    { name: "weight_kg", label: "重量(kg)", type: "number" },
    { name: "length_cm", label: "长(cm)", type: "number" },
    { name: "width_cm", label: "宽(cm)", type: "number" },
    { name: "height_cm", label: "高(cm)", type: "number" },
    { name: "volume", label: "体积(cm³)", type: "number" },
    { name: "shelf_life_days", label: "保质期(天)", type: "number" },
    { name: "purchase_price", label: "采购价", type: "number" },
    { name: "sale_price", label: "销售价", type: "number" },
    { name: "owner_id", label: "货主（可空=自营）", type: "select", nullable: true, options: ownerOptions },
    { name: "status", label: "状态", type: "select", options: [{ value: "active", label: "启用" }, { value: "inactive", label: "停用" }] },
    { name: "note", label: "备注", type: "textarea", full: true },
  ];
}

async function loadOwners() {
  const data = await api("GET", "/api/owners?page_size=100");
  ownerOptions = [{ value: "", label: "自营" }].concat(
    data.owners.map((o) => ({ value: o.id, label: `${o.code} · ${o.name}` }))
  );
  document.getElementById("ownerFilter").insertAdjacentHTML("beforeend",
    data.owners.map((o) => `<option value="${o.id}">${esc(o.code)} · ${esc(o.name)}</option>`).join(""));
}

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const oid = document.getElementById("ownerFilter").value;
  const qs = new URLSearchParams({ page, page_size: pageSize });
  if (kw) qs.set("keyword", kw);
  if (oid) qs.set("owner_id", oid);
  try {
    const data = await api("GET", "/api/products?" + qs);
    document.getElementById("tbody").innerHTML = data.products.map((p) =>
      `<tr>
        <td>${p.id}</td><td>${esc(p.sku)}</td><td>${esc(p.name)}</td>
        <td>${esc(p.barcode)}</td><td>${esc(p.brand)}</td><td>${esc(p.spec)}</td>
        <td>${esc(p.category)}</td>
        <td>${p.owner_code ? esc(p.owner_code + " · " + p.owner_name) : '<span class="muted">自营</span>'}</td>
        <td>${p.purchase_price}</td><td>${p.sale_price}</td>
        <td><b>${p.stock_qty}</b></td>
        <td>${statusTag(p.status)}</td>
        <td>
          <button class="btn secondary sm" onclick="openEdit(${p.id})">编辑</button>
          <button class="btn secondary sm" onclick="manageProductAttrs(${p.id})">条码/包装</button>
          <button class="btn danger sm" onclick="del(${p.id})">删除</button>
        </td>
      </tr>`).join("");
    document.getElementById("pageInfo").textContent = `第 ${data.page} 页 / 共 ${data.total} 条`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page * pageSize >= data.total;
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function turn(d) { page += d; load(); }

function openCreate() {
  openForm({
    title: "新建物料", submitText: "创建", width: 760, fields: productFields(),
    onSubmit: async (p) => {
      await api("POST", "/api/products", autoVolume(p));
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
}

async function openEdit(id) {
  const data = await api("GET", "/api/products/" + id);
  openForm({
    title: "编辑物料", submitText: "保存", width: 760, fields: productFields(), values: data.product,
    onSubmit: async (p) => {
      await api("PUT", "/api/products/" + id, autoVolume(p));
      showMsg(document.getElementById("msg"), "已保存", "success");
      load();
    },
  });
}

// 条码与包装管理（多条码 / 多层级包装规格）
async function manageProductAttrs(id) {
  const data = await api("GET", "/api/products/" + id);
  const p = data.product;
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  ov.innerHTML = `
    <div class="modal" style="width:min(780px,100%)">
      <div class="modal-head"><h3>条码与包装：${esc(p.name)}</h3><button class="modal-x" type="button" aria-label="关闭">×</button></div>
      <div class="modal-body">
        <h4>产品条码（多条码，可设主条码）</h4>
        <div class="toolbar">
          <input id="bcInput" placeholder="输入条码">
          <label class="inline"><input type="checkbox" id="bcPrim"> 设为主条码</label>
          <button class="btn sm" id="bcAdd">+ 添加</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>条码</th><th>主</th><th>操作</th></tr></thead>
          <tbody id="bcBody"></tbody>
        </table></div>

        <h4 style="margin-top:16px">包装层级（多规格：主箱/内箱/中箱，长宽高体积重量）</h4>
        <div class="table-wrap"><table>
          <thead><tr><th>层级</th><th>长(cm)</th><th>宽(cm)</th><th>高(cm)</th><th>体积(cm³)</th><th>重(kg)</th><th>每箱数量</th><th>操作</th></tr></thead>
          <tbody id="pkgBody"></tbody>
        </table></div>
        <div class="toolbar" style="margin-top:8px">
          <select id="pkLevel" style="width:110px">
            <option value="1级">1级</option><option value="2级">2级</option><option value="3级">3级</option>
            <option value="4级">4级</option><option value="5级">5级</option><option value="6级">6级</option>
          </select>
          <input id="pkL" placeholder="长" type="number" step="0.01" style="width:64px">
          <input id="pkW" placeholder="宽" type="number" step="0.01" style="width:64px">
          <input id="pkH" placeholder="高" type="number" step="0.01" style="width:64px">
          <input id="pkWt" placeholder="重kg" type="number" step="0.01" style="width:64px">
          <input id="pkQty" placeholder="每箱" type="number" step="0.01" style="width:64px">
          <button class="btn sm" id="pkAdd">+ 添加包装</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener("click", (e) => {
    if (e.target === ov || e.target.classList.contains("modal-x") || e.target.hasAttribute("data-close")) close();
  });
  ov.querySelector(".modal-x").addEventListener("click", close);

  const bcBody = ov.querySelector("#bcBody");
  const pkgBody = ov.querySelector("#pkgBody");

  async function refreshBc() {
    const d = await api("GET", `/api/products/${id}/barcodes`);
    bcBody.innerHTML = d.barcodes.map((b) =>
      `<tr><td>${esc(b.barcode)}</td><td>${b.is_primary ? "★" : ""}</td>` +
      `<td><button class="btn secondary sm" data-editbc="${b.id}" data-bc="${esc(b.barcode)}" data-prim="${b.is_primary}">编辑</button> ` +
      `<button class="btn danger sm" data-delbc="${b.id}">删</button></td></tr>`).join("");
    bcBody.querySelectorAll("[data-editbc]").forEach((btn) => btn.addEventListener("click", () => {
      editBarcode(Number(btn.dataset.editbc), btn.dataset.bc, btn.dataset.prim === "1");
    }));
    bcBody.querySelectorAll("[data-delbc]").forEach((btn) => btn.addEventListener("click", async () => {
      await api("DELETE", `/api/products/${id}/barcodes/${btn.dataset.delbc}`); refreshBc();
    }));
  }
  async function refreshPkg() {
    const d = await api("GET", `/api/products/${id}/packages`);
    pkgBody.innerHTML = d.packages.map((q) =>
      `<tr><td>${esc(q.pkg_level)}</td><td>${q.length_cm}</td><td>${q.width_cm}</td><td>${q.height_cm}</td>` +
      `<td>${q.volume}</td><td>${q.weight_kg}</td><td>${q.qty_per_package}</td>` +
      `<td><button class="btn secondary sm" data-editpk="${q.id}">编辑</button> ` +
      `<button class="btn danger sm" data-delpk="${q.id}">删</button></td></tr>`).join("");
    pkgBody.querySelectorAll("[data-editpk]").forEach((btn) => btn.addEventListener("click", () => {
      const q = d.packages.find((x) => String(x.id) === btn.dataset.editpk);
      editPackage(q.id, q);
    }));
    pkgBody.querySelectorAll("[data-delpk]").forEach((btn) => btn.addEventListener("click", async () => {
      await api("DELETE", `/api/products/${id}/packages/${btn.dataset.delpk}`); refreshPkg();
    }));
  }
  ov.querySelector("#bcAdd").addEventListener("click", async () => {
    const barcode = ov.querySelector("#bcInput").value.trim();
    if (!barcode) return;
    const is_primary = ov.querySelector("#bcPrim").checked ? 1 : 0;
    await api("POST", `/api/products/${id}/barcodes`, { barcode, is_primary });
    ov.querySelector("#bcInput").value = "";
    refreshBc();
  });
  ov.querySelector("#pkAdd").addEventListener("click", async () => {
    const payload = {
      pkg_level: ov.querySelector("#pkLevel").value.trim() || "主箱",
      length_cm: Number(ov.querySelector("#pkL").value || 0),
      width_cm: Number(ov.querySelector("#pkW").value || 0),
      height_cm: Number(ov.querySelector("#pkH").value || 0),
      weight_kg: Number(ov.querySelector("#pkWt").value || 0),
      qty_per_package: Number(ov.querySelector("#pkQty").value || 0),
    };
    await api("POST", `/api/products/${id}/packages`, payload);
    ["#pkL", "#pkW", "#pkH", "#pkWt", "#pkQty"].forEach((s) => { ov.querySelector(s).value = ""; });
    refreshPkg();
  });
  async function editBarcode(bid, curVal, curPrim) {
    openForm({
      title: "编辑条码", submitText: "保存", width: 420,
      fields: [
        { name: "barcode", label: "条码 *", required: true },
        { name: "is_primary", label: "设为主条码", type: "select",
          options: [{ value: 0, label: "否" }, { value: 1, label: "是" }] },
      ],
      values: { barcode: curVal, is_primary: curPrim ? 1 : 0 },
      onSubmit: async (p) => {
        await api("PUT", `/api/products/${id}/barcodes/${bid}`,
          { barcode: p.barcode, is_primary: p.is_primary ? 1 : 0 });
        refreshBc();
      },
    });
  }
  async function editPackage(pkid, pkg) {
    openForm({
      title: "编辑包装层级", submitText: "保存", width: 560,
      fields: [
        { name: "pkg_level", label: "等级", type: "select",
          options: [1, 2, 3, 4, 5, 6].map((n) => ({ value: `${n}级`, label: `${n}级` })) },
        { name: "length_cm", label: "长(cm)", type: "number" },
        { name: "width_cm", label: "宽(cm)", type: "number" },
        { name: "height_cm", label: "高(cm)", type: "number" },
        { name: "weight_kg", label: "重(kg)", type: "number" },
        { name: "qty_per_package", label: "每箱数量", type: "number" },
      ],
      values: pkg,
      onSubmit: async (p) => {
        await api("PUT", `/api/products/${id}/packages/${pkid}`, p);
        refreshPkg();
      },
    });
  }
  await refreshBc();
  await refreshPkg();
}

async function del(id) {
  if (!confirm("确认删除该物料？（库存非 0 时会被拒绝）")) return;
  try {
    await api("DELETE", "/api/products/" + id);
    showMsg(document.getElementById("msg"), "已删除", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "删除失败：" + e.message, "error");
  }
}

loadOwners().then(load);
</script>
</body>
</html>
