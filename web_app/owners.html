<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>货主管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>货主管理</h1><div class="crumb">MiniWMS / 基础主数据</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>货主列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建货主</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="编码/名称搜索">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="active">启用</option>
        <option value="inactive">停用</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
    <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>编码</th><th>名称</th><th>联系人</th><th>电话</th><th>邮箱</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
    <div class="pager">
      <button class="btn secondary" id="prevBtn" onclick="turn(-1)">上一页</button>
      <span id="pageInfo"></span>
      <button class="btn secondary" id="nextBtn" onclick="turn(1)">下一页</button>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/region.js"></script>
    <script src="/js/layout.js"></script>
<script>
let page = 1, pageSize = 20;

const FIELDS = [
  { name: "code", label: "编码 *", required: true, autocode: true, autocodePrefix: "OW" },
  { name: "name", label: "名称 *", required: true },
  { name: "contact", label: "联系人" },
  { name: "phone", label: "电话" },
  { name: "email", label: "邮箱", type: "email" },
  { name: "region", label: "所在地区（省/市/区）", type: "region", full: true },
  { name: "address", label: "详细地址", full: true },
  { name: "backup_address", label: "备用地址" },
  { name: "authorized_warehouse", label: "授权仓库" },
  { name: "business_scope", label: "经营范围", full: true },
  { name: "extra1", label: "备用字段1" },
  { name: "extra2", label: "备用字段2" },
  { name: "start_date", label: "合作起始", type: "date", nullable: true },
  { name: "end_date", label: "合作截止", type: "date", nullable: true },
  { name: "note", label: "备注", type: "textarea", full: true },
];

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const st = document.getElementById("statusFilter").value;
  const qs = new URLSearchParams({ page, page_size: pageSize });
  if (kw) qs.set("keyword", kw);
  if (st) qs.set("status", st);
  try {
    const data = await api("GET", "/api/owners?" + qs);
    document.getElementById("tbody").innerHTML = data.owners.map((o) =>
      `<tr>
        <td>${o.id}</td><td>${esc(o.code)}</td><td>${esc(o.name)}</td>
        <td>${esc(o.contact)}</td><td>${esc(o.phone)}</td><td>${esc(o.email)}</td>
        <td>${statusTag(o.status)}</td>
        <td>
          <button class="btn secondary sm" onclick="openEdit(${o.id})">编辑</button>
          <button class="btn secondary sm" onclick="manageOwnerCerts(${o.id})">证照</button>
          <button class="btn secondary sm" onclick="toggle(${o.id},'${o.status}')">${o.status === "active" ? "停用" : "启用"}</button>
          <button class="btn danger sm" onclick="del(${o.id})">删除</button>
        </td>
      </tr>`).join("");
    document.getElementById("pageInfo").textContent = `第 ${data.page} 页 / 共 ${data.total} 条`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page * pageSize >= data.total;
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function turn(d) { page += d; load(); }

function openCreate() {
  openForm({
    title: "新建货主", submitText: "创建", width: 760, fields: FIELDS,
    onSubmit: async (p) => {
      await api("POST", "/api/owners", p);
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
}

async function openEdit(id) {
  const data = await api("GET", "/api/owners/" + id);
  openForm({
    title: "编辑货主", submitText: "保存", width: 760, fields: FIELDS, values: data.owner,
    onSubmit: async (p) => {
      await api("PUT", "/api/owners/" + id, p);
      showMsg(document.getElementById("msg"), "已保存", "success");
      load();
    },
  });
}

// 货主证照管理（营业执照/医疗器械经营许可等，可多证）
async function manageOwnerCerts(id) {
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  ov.innerHTML = `
    <div class="modal" style="width:min(640px,100%)">
      <div class="modal-head"><h3>货主证照管理</h3><button class="modal-x" type="button" aria-label="关闭">×</button></div>
      <div class="modal-body">
        <div class="table-wrap"><table>
          <thead><tr><th>类型</th><th>证号</th><th>发证机构</th><th>有效期</th><th>操作</th></tr></thead>
          <tbody id="certBody"></tbody>
        </table></div>
        <div class="toolbar" style="margin-top:8px">
          <input id="cType" placeholder="证照类型" style="width:120px">
          <input id="cNo" placeholder="证号" style="width:120px">
          <input id="cIssuer" placeholder="发证机构" style="flex:1">
          <input id="cFrom" type="date" placeholder="起始" style="width:140px">
          <input id="cTo" type="date" placeholder="截止" style="width:140px">
          <button class="btn sm" id="cAdd">+ 添加</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener("click", (e) => {
    if (e.target === ov || e.target.classList.contains("modal-x") || e.target.hasAttribute("data-close")) close();
  });
  ov.querySelector(".modal-x").addEventListener("click", close);
  const body = ov.querySelector("#certBody");
  async function refresh() {
    const d = await api("GET", `/api/owners/${id}/certs`);
    body.innerHTML = d.certs.map((c) =>
      `<tr><td>${esc(c.cert_type)}</td><td>${esc(c.cert_no)}</td><td>${esc(c.issuer)}</td>` +
      `<td>${esc(c.valid_from)} ~ ${esc(c.valid_to)}</td>` +
      `<td><button class="btn danger sm" data-del="${c.id}">删</button></td></tr>`).join("") || `<tr><td colspan="5" class="muted">暂无证照</td></tr>`;
    body.querySelectorAll("[data-del]").forEach((btn) => btn.addEventListener("click", async () => {
      await api("DELETE", `/api/owners/${id}/certs/${btn.dataset.del}`); refresh();
    }));
  }
  ov.querySelector("#cAdd").addEventListener("click", async () => {
    const cert_type = ov.querySelector("#cType").value.trim();
    if (!cert_type) return;
    await api("POST", `/api/owners/${id}/certs`, {
      cert_type,
      cert_no: ov.querySelector("#cNo").value.trim(),
      issuer: ov.querySelector("#cIssuer").value.trim(),
      valid_from: ov.querySelector("#cFrom").value.trim(),
      valid_to: ov.querySelector("#cTo").value.trim(),
    });
    ["#cType", "#cNo", "#cIssuer", "#cFrom", "#cTo"].forEach((s) => { ov.querySelector(s).value = ""; });
    refresh();
  });
  await refresh();
}

async function toggle(id, status) {
  try {
    await api("PUT", "/api/owners/" + id, { status: status === "active" ? "inactive" : "active" });
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "操作失败：" + e.message, "error");
  }
}

async function del(id) {
  if (!confirm("确认删除该货主？（名下有物料时会被拒绝）")) return;
  try {
    await api("DELETE", "/api/owners/" + id);
    showMsg(document.getElementById("msg"), "已删除", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "删除失败：" + e.message, "error");
  }
}

load();
</script>
</body>
</html>
