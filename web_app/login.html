<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; background:
    linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%); }
  .login-card { width: min(360px, 92vw); background: #fff; border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(15,23,42,.35); padding: 28px 26px; }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .login-card .grid-form { display: grid; gap: 14px; }
  .login-card label { font-size: 13px; font-weight: 600; }
  .login-card input { width: 100%; }
  .login-card .btn { width: 100%; margin-top: 6px; }
  .login-hint { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>MiniWMS 登录</h1>
    <div class="sub">仓库管理系统 · 员工工作台</div>
    <form class="grid-form" id="loginForm">
      <div><label>用户名</label><input name="username" required autocomplete="username"></div>
      <div><label>密码</label><input name="password" type="password" required autocomplete="current-password"></div>
      <div id="err" class="modal-err" style="display:none"></div>
      <button class="btn" type="submit">登录</button>
    </form>
    <div class="login-hint">默认管理员：admin / admin123（首次使用请在「系统管理 → 用户」中修改密码）</div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const err = document.getElementById("err");
  err.style.display = "none";
  const fd = new FormData(ev.target);
  try {
    const data = await api("POST", "/api/auth/login", {
      username: fd.get("username").trim(),
      password: fd.get("password"),
    });
    try {
      localStorage.setItem("miniwms_token", data.token);
      // 保存一份用户摘要，供工作台顶栏展示账号名/角色；不是凭证，token 仍是唯一鉴权依据
      localStorage.setItem("miniwms_user", JSON.stringify(data.user || {}));
    } catch (e) {}
    location.href = "/index.html";
  } catch (e) {
    err.textContent = "登录失败：" + e.message;
    err.style.display = "block";
  }
});
// 已登录直接进首页
if (getToken()) location.href = "/index.html";
</script>
</body>
</html>
