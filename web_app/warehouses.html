<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓库管理 - MiniWMS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div><h1>仓库管理</h1><div class="crumb">MiniWMS / 基础主数据</div></div>
      <span class="env-badge">本地演示 · :5100</span>
    </header>
    <div class="content">
      <div id="msg" class="msg"></div>
  <div class="card">
    <div class="card-head">
      <h2>仓库列表</h2>
      <button class="btn" onclick="openCreate()">+ 新建仓库</button>
    </div>
    <div class="toolbar">
      <input id="kw" placeholder="编码/名称/联系人搜索">
      <select id="statusFilter">
        <option value="">全部状态</option>
        <option value="active">启用</option>
        <option value="inactive">停用</option>
      </select>
      <button class="btn secondary" onclick="load()">查询</button>
    </div>
    <div class="table-wrap">
      <table>
      <thead><tr><th>ID</th><th>编码</th><th>名称</th><th>地址</th><th>联系人</th><th>电话</th><th>数据隔离</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="btn secondary" id="prevBtn" onclick="turn(-1)">上一页</button>
      <span id="pageInfo"></span>
      <button class="btn secondary" id="nextBtn" onclick="turn(1)">下一页</button>
    </div>
  </div>
</div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/layout.js"></script>
<script>
let page = 1, pageSize = 20;

const FIELDS = [
  { name: "code", label: "编码 *", required: true, autocode: true, autocodePrefix: "WH" },
  { name: "name", label: "名称 *", required: true },
  { name: "address", label: "地址", full: true },
  { name: "contact", label: "联系人" },
  { name: "phone", label: "电话" },
  { type: "section", label: "数据隔离（可选，演示按仓分库）" },
  { name: "db_path", label: "独立数据文件", full: true,
    help: "留空＝与全部仓库共用主库（默认，下载即用）；填写项目目录内以 .db 结尾的相对路径（如 wh_sz.db）后，该仓的业务数据写入独立 SQLite 文件，实现物理隔离；保存时自动建库并同步货主/仓库主数据。" },
  { name: "note", label: "备注", type: "textarea", full: true },
];

async function load() {
  const kw = document.getElementById("kw").value.trim();
  const st = document.getElementById("statusFilter").value;
  const qs = new URLSearchParams({ page, page_size: pageSize });
  if (kw) qs.set("keyword", kw);
  if (st) qs.set("status", st);
  try {
    const data = await api("GET", "/api/warehouses?" + qs);
    document.getElementById("tbody").innerHTML = data.warehouses.map((w) =>
      `<tr>
        <td>${w.id}</td><td>${esc(w.code)}</td><td>${esc(w.name)}</td>
        <td>${esc(w.address)}</td><td>${esc(w.contact)}</td><td>${esc(w.phone)}</td>
        <td>${w.db_path
          ? '<span class="tag ok" title="该仓业务数据存放在独立 SQLite 文件">独立库</span> ' + esc(w.db_path)
          : '<span class="muted">共用主库</span>'}</td>
        <td>${statusTag(w.status)}</td>
        <td>
          <button class="btn secondary sm" onclick="openEdit(${w.id})">编辑</button>
          <button class="btn secondary sm" onclick="toggle(${w.id},'${w.status}')">${w.status === "active" ? "停用" : "启用"}</button>
          <button class="btn danger sm" onclick="del(${w.id})">删除</button>
        </td>
      </tr>`).join("");
    document.getElementById("pageInfo").textContent = `第 ${data.page} 页 / 共 ${data.total} 条`;
    document.getElementById("prevBtn").disabled = page <= 1;
    document.getElementById("nextBtn").disabled = page * pageSize >= data.total;
  } catch (e) {
    showMsg(document.getElementById("msg"), "加载失败：" + e.message, "error");
  }
}

function turn(d) { page += d; load(); }

function openCreate() {
  openForm({
    title: "新建仓库", submitText: "创建", width: 680, fields: FIELDS,
    onSubmit: async (p) => {
      await api("POST", "/api/warehouses", p);
      showMsg(document.getElementById("msg"), "创建成功", "success");
      load();
    },
  });
}

async function openEdit(id) {
  const data = await api("GET", "/api/warehouses/" + id);
  openForm({
    title: "编辑仓库", submitText: "保存", width: 680, fields: FIELDS, values: data.warehouse,
    onSubmit: async (p) => {
      await api("PUT", "/api/warehouses/" + id, p);
      showMsg(document.getElementById("msg"), "已保存", "success");
      load();
    },
  });
}

async function toggle(id, status) {
  try {
    await api("PUT", "/api/warehouses/" + id, { status: status === "active" ? "inactive" : "active" });
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "操作失败：" + e.message, "error");
  }
}

async function del(id) {
  if (!confirm("确认删除该仓库？")) return;
  try {
    await api("DELETE", "/api/warehouses/" + id);
    showMsg(document.getElementById("msg"), "已删除", "success");
    load();
  } catch (e) {
    showMsg(document.getElementById("msg"), "删除失败：" + e.message, "error");
  }
}

load();
</script>
</body>
</html>
