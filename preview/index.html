<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniWMS · 在线演示</title>
  <link rel="stylesheet" href="style.css">
  <script src="demo.js" defer></script>
</head>
<body>
  <header>
    <div><b>MiniWMS</b><span>仓库管理系统</span></div>
    <a href="https://github.com/hjf-1114/miniwms">GitHub 仓库 ↗</a>
  </header>
  <main>
    <section class="intro">
      <div><h1>仓储作业工作台</h1><p>浏览演示入库单、批次库存和上架规则。所有数据均为样例。</p></div>
      <span class="badge">只读演示</span>
    </section>
    <div id="summary" class="summary"></div>
    <section class="workspace">
      <nav aria-label="演示模块">
        <button type="button" data-view="orders" aria-pressed="true">入库单</button>
        <button type="button" data-view="stock" aria-pressed="false">批次库存</button>
        <button type="button" data-view="rules" aria-pressed="false">上架规则</button>
      </nav>
      <div class="view">
        <div class="toolbar">
          <label>关键词 <input id="query" type="search" placeholder="搜索单号或货品"></label>
          <label id="status-label">状态 <select id="status"><option value="">全部</option><option>待上架</option><option>上架中</option><option>已完成</option></select></label>
          <span id="result-count" role="status"></span>
        </div>
        <div class="table-wrap" tabindex="0" role="region" aria-label="查询结果"><table id="results"></table></div>
      </div>
    </section>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head">
      <h2 id="detail-title"></h2>
      <form method="dialog"><button type="submit">关闭</button></form>
    </div>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
